        function renderTabs() {
            const tabsContainer = document.getElementById('tabs');
            const contentsContainer = document.getElementById('tab-contents');

            rankings.forEach((rank, idx) => {
                const tab = document.createElement('button');
                tab.className = idx === 0 ? 'tab active' : 'tab';
                tab.textContent = rank.label;
                tab.onclick = () => switchTab(idx);
                tabsContainer.appendChild(tab);

                const content = document.createElement('div');
                content.className = idx === 0 ? 'tab-content active' : 'tab-content';
                content.id = `tab-${idx}`;
                content.innerHTML = rank.tabela;
                contentsContainer.appendChild(content);
            });
        }

        function switchTab(idx) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab')[idx].classList.add('active');
            document.getElementById(`tab-${idx}`).classList.add('active');
        }

        const backToTop = document.getElementById('backToTop');
        if (backToTop) {
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    backToTop.classList.add('visible');
                } else {
                    backToTop.classList.remove('visible');
                }
            });
            backToTop.addEventListener('click', (e) => {
                e.preventDefault();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderTabs();
        });
    </script>
