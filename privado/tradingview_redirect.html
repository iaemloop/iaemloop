<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Abrindo TradingView...</title>
  <style>
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;margin:0;background:#06080d;color:#e2e8f0}
    .card{max-width:520px;padding:28px;border:1px solid rgba(228,209,127,.25);border-radius:20px;background:rgba(15,23,42,.88);box-shadow:0 18px 60px rgba(0,0,0,.35);text-align:center}
    a{color:#e4d17f;font-weight:800}
  </style>
</head>
<body>
  <div class="card">
    <h1>Abrindo TradingView...</h1>
    <p id="msg">Preparando símbolo.</p>
    <p><a id="fallback" href="https://www.tradingview.com/chart/" rel="noopener noreferrer">Abrir manualmente</a></p>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get('tvwidgetsymbol') || params.get('symbol') || '';
      const msg = document.getElementById('msg');
      const fallback = document.getElementById('fallback');
      function cleanSymbol(value) {
        let symbol = String(value || '').trim();
        try { symbol = decodeURIComponent(symbol); } catch (_) {}
        symbol = symbol.replace(/^symbol=/i, '');
        symbol = symbol.split('&')[0].split('?')[0].trim();
        return /^[A-Z0-9_.:-]{1,40}$/i.test(symbol) ? symbol : '';
      }
      const symbol = cleanSymbol(raw);
      const target = symbol
        ? `https://www.tradingview.com/chart/?symbol=${encodeURIComponent(symbol)}`
        : 'https://www.tradingview.com/chart/';
      fallback.href = target;
      msg.textContent = symbol ? `Redirecionando para ${symbol}.` : 'Símbolo não identificado; abrindo gráfico padrão.';
      window.location.replace(target);
    })();
  </script>
</body>
</html>
