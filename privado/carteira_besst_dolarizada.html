<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Carteira BESST & Buffett Dolarizada | IA em Loop Privado</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#06080d;--gold:#e4d17f;--border:rgba(228,209,127,.24);--muted:#94a3b8}
    *{box-sizing:border-box}
    body{font-family:Inter,system-ui,sans-serif;background:#06080d;color:#e2e8f0;min-height:100vh;margin:0;padding:18px}
    a{color:var(--gold)}
    .wrap{max-width:1440px;margin:0 auto}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
    .nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .pill,.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:rgba(228,209,127,.08);color:var(--gold);padding:9px 13px;border-radius:999px;font-weight:800;text-decoration:none}
    .btn{cursor:pointer}
    .gate{background:rgba(15,23,42,.86);border:1px solid var(--border);border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 18px 60px rgba(0,0,0,.35)}
    h1{color:#fff;font-size:clamp(1.8rem,5vw,3rem);margin:0 0 10px}
    .muted{color:var(--muted);line-height:1.65}
    .private-content{display:none}
    html[data-auth="approved"] .private-content{display:block}
    html[data-auth="approved"] .gate{display:none}
    .private-status{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
    .frame{width:100%;min-height:calc(100vh - 76px);border:0;border-radius:12px;background:#0c1016;box-shadow:0 18px 60px rgba(0,0,0,.35)}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div class="nav">
        <a class="pill" href="/index.html">← Home</a>
        <a class="pill" href="index.html">Carteiras em custódia</a>
      </div>
      <button class="btn" type="button" onclick="IAEMLOOPAuth.logout()">Sair</button>
    </div>

    <section class="gate" data-requires-approved-user>
      <h1>🔒 Login necessário</h1>
      <p class="muted" data-auth-status>Validando acesso...</p>
      <a class="btn" href="../area_privada.html?redirect=/privado/carteira_besst_dolarizada.html">Entrar novamente</a>
    </section>

    <section class="private-content" data-private-page="besst_usd">
      <p class="private-status" data-auth-status></p>
      <iframe class="frame" title="Carteira BESST & Buffett Dolarizada" data-private-frame sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin"></iframe>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/iaemloop-auth-config.js"></script>
  <script src="../js/iaemloop-auth.js"></script>
</body>
</html>
