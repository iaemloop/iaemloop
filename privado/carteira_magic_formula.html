<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Carteira Magic Formula B3 | IA em Loop Privado</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#06080d;--card:rgba(15,23,42,.86);--gold:#e4d17f;--muted:#94a3b8;--border:rgba(228,209,127,.24)}
    *{box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background:#06080d;color:#e2e8f0;min-height:100vh;margin:0;padding:24px}
    a{color:var(--gold)}.wrap{max-width:1180px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
    .pill,.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:rgba(228,209,127,.08);color:var(--gold);padding:10px 14px;border-radius:999px;font-weight:800;text-decoration:none}.btn{cursor:pointer}
    .gate,.loading{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 18px 60px rgba(0,0,0,.35)}h1{color:#fff;font-size:clamp(1.8rem,5vw,3rem);margin:0 0 10px}.muted{color:var(--muted);line-height:1.65}
    .private-content{display:none}html[data-auth="approved"] .private-content{display:block}html[data-auth="approved"] .gate{display:none}
    .frame{width:100%;min-height:82vh;border:1px solid var(--border);border-radius:18px;background:#0c1016;box-shadow:0 18px 60px rgba(0,0,0,.35)}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <a class="pill" href="index.html">← Carteiras em custódia</a>
      <button class="btn" type="button" onclick="IAEMLOOPAuth.logout()">Sair</button>
    </div>

    <section class="gate" data-requires-approved-user>
      <h1>🔒 Login necessário</h1>
      <p class="muted" data-auth-status>Validando acesso...</p>
      <a class="btn" href="../area_privada.html?redirect=/privado/carteira_magic_formula.html">Entrar novamente</a>
    </section>

    <section class="private-content" data-private-page="magic_b3">
      <div class="loading">
        <h1>🎯 Carteira Magic Formula B3</h1>
        <p class="muted" data-auth-status>Carregando custódia privada...</p>
      </div>
      <iframe class="frame" title="Carteira Magic Formula B3" data-private-frame sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin"></iframe>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/iaemloop-auth-config.js"></script>
  <script src="../js/iaemloop-auth.js"></script>
</body>
</html>
