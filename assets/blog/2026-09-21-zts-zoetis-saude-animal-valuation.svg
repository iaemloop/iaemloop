<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ZTS, Zoetis e saúde animal — IA em Loop</title>
  <desc id="desc">Diagrama escuro do IA em Loop sobre Zoetis, rankings dolarizados, saúde animal, lucro, guidance e valuation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070c"/>
      <stop offset="0.55" stop-color="#102235"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6EE4EF"/>
      <stop offset="1" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="80" r="210" fill="#6EE4EF" opacity="0.08"/>
  <circle cx="190" cy="575" r="260" fill="#E4D17F" opacity="0.08"/>
  <text x="70" y="90" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">IA em Loop • Stock EUA • Carteira real</text>
  <text x="70" y="155" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">ZTS: saúde animal</text>
  <text x="70" y="218" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">a preço de qualidade?</text>
  <text x="70" y="270" fill="#b8c7d9" font-family="Inter, Arial, sans-serif" font-size="26">Zoetis lidera ranking, mas guidance e demanda em pets cobram disciplina.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="330" width="315" height="150" rx="18" fill="#0f1b28" stroke="#E4D17F" stroke-opacity="0.45"/>
    <text x="95" y="382" fill="#9fb4c7" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Ranking BESST</text>
    <text x="95" y="436" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800">#1</text>
    <text x="168" y="436" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">score 61,5</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="440" y="330" width="315" height="150" rx="18" fill="#0f1b28" stroke="#6EE4EF" stroke-opacity="0.45"/>
    <text x="465" y="382" fill="#9fb4c7" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Magic Formula</text>
    <text x="465" y="436" fill="#6EE4EF" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800">#5</text>
    <text x="548" y="436" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">EY 8,1%</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="810" y="330" width="315" height="150" rx="18" fill="#0f1b28" stroke="#E4D17F" stroke-opacity="0.45"/>
    <text x="835" y="382" fill="#9fb4c7" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">2T26</text>
    <text x="835" y="436" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">US$ 2,5 bi</text>
    <text x="835" y="466" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22">receita quase estável</text>
  </g>
  <path d="M70 540 H1130" stroke="url(#accent)" stroke-width="4" opacity="0.75"/>
  <text x="70" y="585" fill="#9fb4c7" font-family="Inter, Arial, sans-serif" font-size="22">Pergunta central: múltiplo baixo para qualidade perene ou alerta de ciclo em animais de companhia?</text>
</svg>
