<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PSSA3, Porto Seguro e o teste da seguradora de qualidade</title>
  <desc id="desc">Diagrama IA em Loop conectando ranking Magic Formula, custódia, ROIC, preço, dividendos futuros e riscos de sinistro em PSSA3.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080D"/>
      <stop offset="0.55" stop-color="#132033"/>
      <stop offset="1" stop-color="#1d3328"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE4EF"/>
      <stop offset="1" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="90" r="220" fill="#E4D17F" opacity="0.08"/>
  <circle cx="135" cy="555" r="230" fill="#6EE4EF" opacity="0.08"/>
  <text x="70" y="78" fill="#94a3b8" font-family="Inter, Arial" font-size="24" font-weight="700">IA em Loop • Ação Brasil</text>
  <text x="70" y="144" fill="url(#gold)" font-family="Inter, Arial" font-size="58" font-weight="800">PSSA3</text>
  <text x="70" y="200" fill="#ffffff" font-family="Inter, Arial" font-size="40" font-weight="750">qualidade ou preço cheio?</text>
  <text x="70" y="250" fill="#cbd5e1" font-family="Inter, Arial" font-size="24">Porto Seguro combina marca, recorrência e retorno alto; a tese depende de disciplina técnica, juros e valuation.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="310" width="250" height="118" rx="18" fill="#0b1220" stroke="#E4D17F" stroke-opacity="0.28"/>
    <text x="95" y="350" fill="#94a3b8" font-family="Inter, Arial" font-size="18" font-weight="700">Magic Formula</text>
    <text x="95" y="392" fill="#E4D17F" font-family="Inter, Arial" font-size="38" font-weight="800">#1</text>
    <text x="150" y="392" fill="#cbd5e1" font-family="Inter, Arial" font-size="22">score 2</text>
    <rect x="350" y="310" width="250" height="118" rx="18" fill="#0b1220" stroke="#E4D17F" stroke-opacity="0.28"/>
    <text x="375" y="350" fill="#94a3b8" font-family="Inter, Arial" font-size="18" font-weight="700">Retorno</text>
    <text x="375" y="392" fill="#E4D17F" font-family="Inter, Arial" font-size="36" font-weight="800">ROIC 77,4%</text>
    <rect x="630" y="310" width="250" height="118" rx="18" fill="#0b1220" stroke="#E4D17F" stroke-opacity="0.28"/>
    <text x="655" y="350" fill="#94a3b8" font-family="Inter, Arial" font-size="18" font-weight="700">Preço</text>
    <text x="655" y="392" fill="#E4D17F" font-family="Inter, Arial" font-size="36" font-weight="800">R$ 48,53</text>
    <rect x="910" y="310" width="220" height="118" rx="18" fill="#0b1220" stroke="#6EE4EF" stroke-opacity="0.25"/>
    <text x="935" y="350" fill="#94a3b8" font-family="Inter, Arial" font-size="18" font-weight="700">Custódia</text>
    <text x="935" y="392" fill="#6EE4EF" font-family="Inter, Arial" font-size="34" font-weight="800">real</text>
  </g>
  <path d="M120 510 C245 455, 365 560, 505 485 S750 450, 880 505 S1010 540, 1100 470" fill="none" stroke="#6EE4EF" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  <path d="M120 532 C245 477, 365 582, 505 507 S750 472, 880 527 S1010 562, 1100 492" fill="none" stroke="#E4D17F" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <text x="70" y="590" fill="#94a3b8" font-family="Inter, Arial" font-size="18">Fonte: rankings IA em Loop, carteiras reais, Porto Seguro RI e preço público consultados em 12/08/2026.</text>
</svg>
