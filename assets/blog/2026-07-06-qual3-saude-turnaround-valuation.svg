<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">QUAL3 no IA em Loop: desconto, margem e prova de execução</title>
  <desc id="desc">Diagrama com ranking, preço, margem e risco de turnaround para Qualicorp QUAL3.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080D"/>
      <stop offset="0.55" stop-color="#10263A"/>
      <stop offset="1" stop-color="#19364D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E4D17F"/>
      <stop offset="1" stop-color="#AA8451"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="105" r="210" fill="#6EE4EF" opacity="0.08"/>
  <circle cx="170" cy="560" r="260" fill="#E4D17F" opacity="0.08"/>
  <text x="72" y="92" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#6EE4EF">IA em Loop • Leitura diária</text>
  <text x="72" y="158" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="900" fill="#FFFFFF">QUAL3</text>
  <text x="290" y="154" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#E4D17F">saúde, desconto e prova de execução</text>
  <text x="72" y="215" font-family="Inter, Arial, sans-serif" font-size="27" fill="#CBD5E1">Ranking Magic Formula #4 • carteira real • margem EBIT alta</text>

  <g filter="url(#shadow)">
    <rect x="72" y="270" width="315" height="155" rx="18" fill="#0B1220" opacity="0.88" stroke="#E4D17F" stroke-opacity="0.35"/>
    <text x="100" y="322" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#94A3B8">Preço consultado</text>
    <text x="100" y="382" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="900" fill="url(#gold)">R$ 1,80</text>
    <text x="100" y="410" font-family="Inter, Arial, sans-serif" font-size="19" fill="#CBD5E1">+8,4% vs. PM R$ 1,66</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="443" y="270" width="315" height="155" rx="18" fill="#0B1220" opacity="0.88" stroke="#6EE4EF" stroke-opacity="0.3"/>
    <text x="471" y="322" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#94A3B8">QUAL3 no ranking</text>
    <text x="471" y="382" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="900" fill="#6EE4EF">#4</text>
    <text x="545" y="382" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#E4D17F">ROIC 19,3% • EY 37,2%</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="814" y="270" width="315" height="155" rx="18" fill="#0B1220" opacity="0.88" stroke="#E4D17F" stroke-opacity="0.35"/>
    <text x="842" y="322" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#94A3B8">Teste central</text>
    <text x="842" y="370" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">turnaround</text>
    <text x="842" y="410" font-family="Inter, Arial, sans-serif" font-size="20" fill="#CBD5E1">lucro voltou no 1T26; precisa persistir</text>
  </g>

  <path d="M110 515 C290 460, 398 560, 558 500 S820 442, 1065 500" fill="none" stroke="#6EE4EF" stroke-width="8" stroke-linecap="round" opacity="0.72"/>
  <circle cx="110" cy="515" r="10" fill="#E4D17F"/>
  <circle cx="558" cy="500" r="10" fill="#E4D17F"/>
  <circle cx="1065" cy="500" r="10" fill="#E4D17F"/>
  <text x="72" y="585" font-family="Inter, Arial, sans-serif" font-size="22" fill="#94A3B8">Leitura: o desconto só vira tese se a melhora operacional deixar de ser pontual.</text>
</svg>
