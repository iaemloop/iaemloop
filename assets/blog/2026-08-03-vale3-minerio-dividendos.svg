<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">VALE3, minério e dividendos</title>
  <desc id="desc">Painel visual IA em Loop com preço, ranking, dividend yield, retorno sobre capital e riscos de ciclo para VALE3.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06080D"/>
      <stop offset="0.55" stop-color="#101923"/>
      <stop offset="1" stop-color="#19364D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#E4D17F"/>
      <stop offset="1" stop-color="#AA8451"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1015" cy="135" r="210" fill="#6EE4EF" opacity="0.08"/>
  <circle cx="120" cy="535" r="180" fill="#E4D17F" opacity="0.07"/>
  <text x="70" y="78" fill="#6EE4EF" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">IA em Loop • leitura educacional</text>
  <text x="70" y="150" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800">VALE3</text>
  <text x="70" y="210" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="750">minério, caixa e o teste do ciclo</text>
  <text x="70" y="258" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">Barata em retorno operacional, mas exposta a China, minério e câmbio.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="315" width="240" height="135" rx="18" fill="#10151D" stroke="#E4D17F" stroke-opacity="0.32"/>
    <text x="95" y="360" fill="#94A3B8" font-family="Inter, Arial" font-size="19" font-weight="700">Preço consultado</text>
    <text x="95" y="407" fill="url(#gold)" font-family="Inter, Arial" font-size="36" font-weight="800">R$ 74,29</text>
    <text x="95" y="435" fill="#CBD5E1" font-family="Inter, Arial" font-size="16">Yahoo Finance • 03/08</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="340" y="315" width="240" height="135" rx="18" fill="#10151D" stroke="#6EE4EF" stroke-opacity="0.26"/>
    <text x="365" y="360" fill="#94A3B8" font-family="Inter, Arial" font-size="19" font-weight="700">Magic Formula</text>
    <text x="365" y="407" fill="#6EE4EF" font-family="Inter, Arial" font-size="36" font-weight="800">#23</text>
    <text x="365" y="435" fill="#CBD5E1" font-family="Inter, Arial" font-size="16">ROIC 16,7% • EY 15,5%</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="610" y="315" width="240" height="135" rx="18" fill="#10151D" stroke="#E4D17F" stroke-opacity="0.32"/>
    <text x="635" y="360" fill="#94A3B8" font-family="Inter, Arial" font-size="19" font-weight="700">Barsi dividendos</text>
    <text x="635" y="407" fill="url(#gold)" font-family="Inter, Arial" font-size="36" font-weight="800">DY 9,39%</text>
    <text x="635" y="435" fill="#CBD5E1" font-family="Inter, Arial" font-size="16">P/VP 1,64 • P/L 21,49</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="880" y="315" width="240" height="135" rx="18" fill="#10151D" stroke="#F97316" stroke-opacity="0.32"/>
    <text x="905" y="360" fill="#94A3B8" font-family="Inter, Arial" font-size="19" font-weight="700">Risco central</text>
    <text x="905" y="407" fill="#FBBF24" font-family="Inter, Arial" font-size="32" font-weight="800">ciclo</text>
    <text x="905" y="435" fill="#CBD5E1" font-family="Inter, Arial" font-size="16">minério • China • câmbio</text>
  </g>

  <path d="M92 530 C190 488, 276 508, 366 472 S520 423, 650 453 S830 482, 965 414 S1100 388, 1130 360" fill="none" stroke="#6EE4EF" stroke-width="8" stroke-linecap="round" opacity="0.88"/>
  <path d="M92 558 H1130" stroke="#334155" stroke-width="2"/>
  <text x="70" y="602" fill="#94A3B8" font-family="Inter, Arial" font-size="18">Pergunta: desconto de qualidade ou ciclo pesado ainda mandando no preço?</text>
</svg>
