<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ENGI3, Energisa, concessões elétricas e dividendos</title>
  <desc id="desc">Diagrama IA em Loop sobre ENGI3, ranking BESST e Buffett, compra real, EBITDA, alavancagem e concessões de energia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06080D"/>
      <stop offset="0.55" stop-color="#101826"/>
      <stop offset="1" stop-color="#19364D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#6EE4EF"/>
      <stop offset="1" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#6EE4EF" stroke-width="2">
    <path d="M70 500 C230 370 310 430 450 300 S760 170 1110 90" fill="none"/>
    <path d="M40 190 C210 120 360 180 520 125 S850 70 1160 150" fill="none"/>
    <path d="M135 540 L260 430 L390 455 L520 310 L690 355 L860 210 L1030 245" fill="none"/>
  </g>
  <circle cx="945" cy="160" r="86" fill="none" stroke="#E4D17F" stroke-width="5" opacity="0.75"/>
  <path d="M945 86 L908 168 H948 L925 234 L1000 138 H958 Z" fill="url(#gold)" filter="url(#glow)"/>
  <text x="70" y="95" fill="#E4D17F" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800">IA em Loop • Ação Brasil</text>
  <text x="70" y="168" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="64" font-weight="900">ENGI3</text>
  <text x="70" y="228" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">Energisa: concessões, EBITDA e dívida</text>
  <text x="70" y="276" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="24">A pergunta: previsibilidade regulada compensa alavancagem e lucro pressionado?</text>
  <g transform="translate(70 345)">
    <rect width="250" height="120" rx="18" fill="rgba(6,8,13,.55)" stroke="#E4D17F" stroke-opacity=".35"/>
    <text x="24" y="42" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Ranking B3</text>
    <text x="24" y="84" fill="#E4D17F" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="900">#2 BESST</text>
  </g>
  <g transform="translate(350 345)">
    <rect width="250" height="120" rx="18" fill="rgba(6,8,13,.55)" stroke="#6EE4EF" stroke-opacity=".35"/>
    <text x="24" y="42" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">EBITDA 2T26</text>
    <text x="24" y="84" fill="#6EE4EF" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="900">R$ 2,266 bi</text>
  </g>
  <g transform="translate(630 345)">
    <rect width="250" height="120" rx="18" fill="rgba(6,8,13,.55)" stroke="#E4D17F" stroke-opacity=".35"/>
    <text x="24" y="42" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Aporte agosto</text>
    <text x="24" y="84" fill="#E4D17F" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="900">24 ações</text>
  </g>
  <g transform="translate(910 345)">
    <rect width="220" height="120" rx="18" fill="rgba(6,8,13,.55)" stroke="#f87171" stroke-opacity=".35"/>
    <text x="24" y="42" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Risco-chave</text>
    <text x="24" y="84" fill="#fca5a5" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="900">Dívida</text>
  </g>
  <text x="70" y="555" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="23">Energia regulada pode dar previsibilidade; a tese depende de tarifa, capex e desalavancagem.</text>
</svg>
