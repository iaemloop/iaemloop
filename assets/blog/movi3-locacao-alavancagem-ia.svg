<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">MOVI3 no radar IA em Loop</title>
  <desc id="desc">Diagrama sobre Movida, ranking Magic Formula, locação de veículos, juros, seminovos, alavancagem e IA operacional.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06080D"/>
      <stop offset="0.52" stop-color="#102333"/>
      <stop offset="1" stop-color="#19364D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#E4D17F"/>
      <stop offset="1" stop-color="#AA8451"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <circle cx="1040" cy="94" r="170" fill="#6EE4EF" opacity="0.08"/>
  <circle cx="130" cy="560" r="220" fill="#E4D17F" opacity="0.08"/>
  <text x="70" y="90" fill="#6EE4EF" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">IA em Loop • leitura diária</text>
  <text x="70" y="150" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="800">MOVI3</text>
  <text x="70" y="204" fill="#E4D17F" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">locação de veículos no teste da dívida</text>
  <text x="70" y="246" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="22">Ranking Magic Formula • ciclo de seminovos • juros • IA operacional</text>

  <g filter="url(#shadow)">
    <rect x="70" y="310" width="290" height="180" rx="20" fill="#0b1520" stroke="#E4D17F" stroke-opacity="0.32"/>
    <text x="98" y="356" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">RANKING</text>
    <text x="98" y="404" fill="#E4D17F" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="800">Top 20</text>
    <text x="98" y="444" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="20">Magic Formula</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="455" y="310" width="290" height="180" rx="20" fill="#0b1520" stroke="#6EE4EF" stroke-opacity="0.26"/>
    <text x="483" y="356" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">QUALIDADE</text>
    <text x="483" y="404" fill="#6EE4EF" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="800">ROIC 14,4%</text>
    <text x="483" y="444" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="20">Fundamentus</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="840" y="310" width="290" height="180" rx="20" fill="#0b1520" stroke="#E4D17F" stroke-opacity="0.32"/>
    <text x="868" y="356" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">PREÇO</text>
    <text x="868" y="404" fill="#E4D17F" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="800">P/EBIT 1,15</text>
    <text x="868" y="444" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="20">P/L 11,58 • DY 6,2%</text>
  </g>

  <path d="M160 548 C280 515 355 566 472 532 S675 510 778 540 S980 585 1100 520" fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.9"/>
  <text x="70" y="590" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="19">Pergunta central: a melhora do lucro compensa a alavancagem e o ciclo de frota?</text>
</svg>
