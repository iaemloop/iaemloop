<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CSMG3 — saneamento, privatização e preço</title>
  <desc id="desc">Diagrama em fundo escuro sobre Copasa, carteira real BESST, saneamento, privatização, valuation e riscos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#102637"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#6EE4EF"/>
      <stop offset="1" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="210" fill="#6EE4EF" opacity="0.07"/>
  <circle cx="140" cy="560" r="240" fill="#E4D17F" opacity="0.08"/>
  <text x="72" y="78" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">IA em Loop • leitura diária • 15/07/2026</text>
  <text x="72" y="145" fill="url(#gold)" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="900">CSMG3</text>
  <text x="72" y="202" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">Saneamento bom, preço exigente</text>
  <text x="72" y="252" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">Privatização pode destravar valor, mas já entrou no preço?</text>

  <g filter="url(#shadow)">
    <rect x="74" y="310" width="310" height="170" rx="24" fill="#0b1624" stroke="#6EE4EF" stroke-opacity="0.28"/>
    <text x="105" y="360" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Carteira real BESST</text>
    <text x="105" y="410" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="900">2 un. • PM R$ 53,83</text>
    <text x="105" y="452" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">+22,8% vs. cotação consultada</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="445" y="310" width="310" height="170" rx="24" fill="#0b1624" stroke="#E4D17F" stroke-opacity="0.28"/>
    <text x="476" y="360" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Fundamentus</text>
    <text x="476" y="410" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="900">P/L 18,55 • P/VP 2,87</text>
    <text x="476" y="452" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">ROE 15,5% • ROIC 11,6%</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="816" y="310" width="310" height="170" rx="24" fill="#0b1624" stroke="#6EE4EF" stroke-opacity="0.28"/>
    <text x="847" y="360" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Pergunta do dia</text>
    <text x="847" y="410" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="900">Catalisador ou euforia?</text>
    <text x="847" y="452" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Privatização precisa virar retorno</text>
  </g>
  <path d="M105 545 C240 500, 315 535, 430 490 S640 430, 745 455 S930 535, 1088 485" fill="none" stroke="#6EE4EF" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  <path d="M105 555 C240 525, 315 560, 430 520 S640 490, 745 505 S930 570, 1088 540" fill="none" stroke="#E4D17F" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
</svg>
