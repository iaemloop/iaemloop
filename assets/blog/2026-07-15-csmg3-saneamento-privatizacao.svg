<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CSMG3 — saneamento, privatização e preço</title>
  <desc id="desc">Diagrama em fundo escuro sobre Copasa, carteira real BESST, saneamento, privatização, valuation e riscos, com textos alinhados e sem cortes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.54" stop-color="#102637"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#6EE4EF"/>
      <stop offset="1" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.34"/>
    </filter>
    <style>
      .font{font-family:Inter,Arial,sans-serif}.muted{fill:#94a3b8}.soft{fill:#cbd5e1}.white{fill:#fff}.gold{fill:#E4D17F}.cyan{fill:#6EE4EF}.card{fill:#0b1624;stroke-width:2}.small{font-size:20px;font-weight:700}.headline{font-size:34px;font-weight:900}.sub{font-size:21px;font-weight:700}.label{font-size:18px;font-weight:700;letter-spacing:.3px}.micro{font-size:16px;font-weight:650}.title{font-size:40px;font-weight:900}.kicker{font-size:23px;font-weight:700}
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="128" r="205" fill="#6EE4EF" opacity="0.07"/>
  <circle cx="128" cy="560" r="230" fill="#E4D17F" opacity="0.075"/>
  <path d="M0 622 C170 515,310 575,455 510 S690 430,825 492 S1025 560,1200 472 L1200 630 L0 630 Z" fill="#07111f" opacity="0.24"/>

  <text class="font muted kicker" x="72" y="78">IA em Loop • leitura diária • 15/07/2026</text>
  <text class="font" x="72" y="145" fill="url(#gold)" font-size="72" font-weight="900">CSMG3</text>
  <text class="font white title" x="72" y="202">Saneamento bom, preço exigente</text>
  <text class="font soft" x="72" y="252" font-size="27" font-weight="650">Privatização pode destravar valor, mas já entrou no preço?</text>

  <g filter="url(#shadow)">
    <rect class="card" x="64" y="318" width="332" height="178" rx="24" stroke="#6EE4EF" stroke-opacity="0.34"/>
    <text class="font muted label" x="94" y="358">Carteira real BESST</text>
    <text class="font gold headline" x="94" y="407">2 un. • PM R$ 53,83</text>
    <text class="font soft sub" x="94" y="447">+22,8% vs. cotação</text>
    <text class="font muted micro" x="94" y="475">posição pequena; margem menor</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="434" y="318" width="332" height="178" rx="24" stroke="#E4D17F" stroke-opacity="0.34"/>
    <text class="font muted label" x="464" y="358">Fundamentus</text>
    <text class="font gold headline" x="464" y="407">P/L 18,55</text>
    <text class="font gold headline" x="464" y="446">P/VP 2,87</text>
    <text class="font soft micro" x="464" y="475">ROE 15,5% • ROIC 11,6%</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="804" y="318" width="332" height="178" rx="24" stroke="#6EE4EF" stroke-opacity="0.34"/>
    <text class="font muted label" x="834" y="358">Pergunta do dia</text>
    <text class="font gold headline" x="834" y="404">Catalisador</text>
    <text class="font gold headline" x="834" y="443">ou euforia?</text>
    <text class="font soft micro" x="834" y="474">precisa virar retorno real</text>
  </g>

  <path d="M88 540 C230 518, 320 530, 440 520 S650 505, 770 520 S950 552, 1114 532" fill="none" stroke="#6EE4EF" stroke-width="7" stroke-linecap="round" opacity="0.64"/>
  <path d="M88 558 C230 538, 320 550, 440 544 S650 530, 770 542 S950 575, 1114 555" fill="none" stroke="#E4D17F" stroke-width="4" stroke-linecap="round" opacity="0.62"/>
</svg>
