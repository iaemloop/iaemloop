    <text x="22" y="36" fill="#94A3B8" font-family="Inter, Arial" font-size="18" font-weight="700">ROIC local</text>
    <text x="22" y="82" fill="#E4D17F" font-family="Inter, Arial" font-size="38" font-weight="800">35,5%</text>
