<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">WIZC3, Wiz e o desconto da distribuição financeira</title>
  <desc id="desc">Visual IA em Loop sobre ranking Magic Formula, carteira real, seguros, crédito, margem e riscos de canal.</desc>
  <defs>
