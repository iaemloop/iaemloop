<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Adobe ADBE: caixa forte versus risco de IA</title>
  <desc id="desc">Diagrama do IA em Loop mostrando Adobe, Magic Formula EUA, geração de caixa, valuation e risco de IA generativa.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#06080D"/>
      <stop offset="52%" stop-color="#102538"/>
      <stop offset="100%" stop-color="#191528"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#6EE4EF"/>
      <stop offset="100%" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="95" r="210" fill="#6EE4EF" opacity="0.08"/>
  <circle cx="150" cy="560" r="250" fill="#E4D17F" opacity="0.07"/>
  <g filter="url(#shadow)">
    <rect x="70" y="60" width="1060" height="510" rx="30" fill="#101a27" opacity="0.88" stroke="#E4D17F" stroke-opacity="0.22"/>
  </g>
  <text x="100" y="120" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">IA EM LOOP • STOCK EUA • MAGIC FORMULA</text>
  <text x="100" y="195" fill="url(#gold)" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="900">ADBE / Adobe</text>
  <text x="100" y="248" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">ficou barata ou a IA está corroendo o fosso?</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="100" y="305" width="220" height="120" rx="18" fill="#06080D" opacity="0.70" stroke="#6EE4EF" stroke-opacity="0.30"/>
    <text x="122" y="348" fill="#94a3b8" font-size="20" font-weight="700">Ranking</text>
    <text x="122" y="392" fill="#E4D17F" font-size="42" font-weight="900">#4</text>
    <text x="122" y="418" fill="#cbd5e1" font-size="17">Magic Formula EUA</text>
    <rect x="350" y="305" width="220" height="120" rx="18" fill="#06080D" opacity="0.70" stroke="#E4D17F" stroke-opacity="0.26"/>
    <text x="372" y="348" fill="#94a3b8" font-size="20" font-weight="700">P/L</text>
    <text x="372" y="392" fill="#E4D17F" font-size="42" font-weight="900">12,95</text>
    <text x="372" y="418" fill="#cbd5e1" font-size="17">base 21/07/2026</text>
    <rect x="600" y="305" width="220" height="120" rx="18" fill="#06080D" opacity="0.70" stroke="#6EE4EF" stroke-opacity="0.30"/>
    <text x="622" y="348" fill="#94a3b8" font-size="20" font-weight="700">ROIC proxy</text>
    <text x="622" y="392" fill="#E4D17F" font-size="42" font-weight="900">39,4%</text>
    <text x="622" y="418" fill="#cbd5e1" font-size="17">qualidade + preço</text>
    <rect x="850" y="305" width="220" height="120" rx="18" fill="#06080D" opacity="0.70" stroke="#E4D17F" stroke-opacity="0.26"/>
    <text x="872" y="348" fill="#94a3b8" font-size="20" font-weight="700">FCF yield</text>
    <text x="872" y="392" fill="#E4D17F" font-size="42" font-weight="900">10,24%</text>
    <text x="872" y="418" fill="#cbd5e1" font-size="17">caixa importa</text>
  </g>
  <path d="M115 485 C235 455 330 518 448 486 S680 440 800 492 S975 530 1085 475" fill="none" stroke="#6EE4EF" stroke-width="6" stroke-linecap="round" opacity="0.80"/>
  <path d="M115 520 C250 475 370 545 500 510 S725 455 855 520 S1010 550 1085 505" fill="none" stroke="#E4D17F" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <text x="100" y="555" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Caixa forte • valuation comprimido • risco real de IA generativa</text>
</svg>
