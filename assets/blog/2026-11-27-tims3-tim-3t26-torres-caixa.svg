<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <style>
      .bg { fill: #06080D; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1; }
      .title { fill: #E4D17F; font: 700 18px 'Inter', sans-serif; }
      .sub { fill: #94a3b8; font: 400 13px 'Inter', sans-serif; }
      .value { fill: #FFFFFF; font: 800 27px 'Inter', sans-serif; }
      .label { fill: #cbd5e1; font: 500 13px 'Inter', sans-serif; }
      .up { fill: #6EE4EF; font: 800 13px 'Inter', sans-serif; }
      .down { fill: #f59e0b; font: 800 13px 'Inter', sans-serif; }
      .section { fill: #E4D17F; font: 700 15px 'Inter', sans-serif; }
      .body { fill: #cbd5e1; font: 400 13px 'Inter', sans-serif; }
      .em { fill: #6EE4EF; font: 800 23px 'Inter', sans-serif; }
      .fine { fill: #64748b; font: 400 11px 'Inter', sans-serif; }
    </style>
  </defs>
  <rect class="bg" width="900" height="520"/>
  <text x="40" y="50" class="title">TIM — resultado do 3T26 e acordo de infraestrutura</text>
  <text x="40" y="73" class="sub">Dados do trimestre encerrado em 30/09/2026 · acordo com a SBA anunciado em 25/11/2026</text>

  <g transform="translate(40,100)">
    <rect class="panel" x="0" y="0" width="195" height="132" rx="10"/>
    <text x="18" y="38" class="value">R$ 7,07 bi</text>
    <text x="18" y="65" class="label">Receita líquida</text>
    <text x="18" y="91" class="up">+5,3% a/a</text>
    <text x="18" y="113" class="fine">Serviços: R$ 6,88 bi</text>
  </g>
  <g transform="translate(248,100)">
    <rect class="panel" x="0" y="0" width="195" height="132" rx="10"/>
    <text x="18" y="38" class="value">R$ 3,70 bi</text>
    <text x="18" y="65" class="label">EBITDA normalizado</text>
    <text x="18" y="91" class="up">+6,7% a/a</text>
    <text x="18" y="113" class="fine">Margem: 52,4%</text>
  </g>
  <g transform="translate(456,100)">
    <rect class="panel" x="0" y="0" width="195" height="132" rx="10"/>
    <text x="18" y="38" class="value">R$ 1,94 bi</text>
    <text x="18" y="65" class="label">Fluxo operacional*</text>
    <text x="18" y="91" class="up">+11,6% a/a</text>
    <text x="18" y="113" class="fine">Margem: 27,4%</text>
  </g>
  <g transform="translate(664,100)">
    <rect class="panel" x="0" y="0" width="196" height="132" rx="10"/>
    <text x="18" y="38" class="value">R$ 1,11 bi</text>
    <text x="18" y="65" class="label">Lucro normalizado</text>
    <text x="18" y="91" class="down">−7,8% a/a</text>
    <text x="18" y="113" class="fine">Resultado financeiro pesa</text>
  </g>

  <g transform="translate(40,258)">
    <rect class="panel" x="0" y="0" width="400" height="208" rx="10"/>
    <text x="20" y="35" class="section">Operação: crescimento com composição diferente</text>
    <text x="20" y="74" class="em">+5,0%</text>
    <text x="112" y="74" class="body">ARPU móvel, para R$ 34,80</text>
    <text x="20" y="110" class="em">+5,2%</text>
    <text x="112" y="110" class="body">base pós-paga, para 34,0 mi</text>
    <text x="20" y="146" class="em">+13,2%</text>
    <text x="128" y="146" class="body">clientes TIM Ultrafibra, 931 mil</text>
    <text x="20" y="182" class="down">−9,0%</text>
    <text x="112" y="182" class="body">base pré-paga</text>
  </g>

  <g transform="translate(460,258)">
    <rect class="panel" x="0" y="0" width="400" height="208" rx="10"/>
    <text x="20" y="35" class="section">Acordo TIM + SBA</text>
    <text x="20" y="78" class="em">≈16%</text>
    <text x="112" y="78" class="body">da base de torres usada pela TIM</text>
    <text x="20" y="112" class="body">Objetivo declarado: previsibilidade contratual,</text>
    <text x="20" y="135" class="body">gestão simplificada e eficiência de arrendamentos.</text>
    <text x="20" y="170" class="down">Não divulgado:</text>
    <text x="130" y="170" class="body">prazo, valor ou economia anual.</text>
  </g>

  <text x="40" y="500" class="fine">* Indicador gerencial da TIM: EBITDA normalizado após arrendamentos menos CAPEX. Fontes: TIM S.A., release 3T26 e comunicado de 25/11/2026.</text>
</svg>