<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Allstate no terceiro trimestre de 2026</title><desc id="desc">Fluxo entre prêmios, perdas catastróficas, reservas, investimentos e capital.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07162d"/><stop offset="1" stop-color="#123f57"/></linearGradient><style>.k{font:700 24px Arial,sans-serif;fill:#dff6ff}.v{font:700 42px Arial,sans-serif;fill:#fff}.s{font:400 19px Arial,sans-serif;fill:#b9d8e7}.n{font:700 17px Arial,sans-serif;fill:#78dfc1}</style></defs><rect width="1200" height="630" fill="url(#bg)"/><text x="72" y="76" class="k">ALLSTATE · 3T26</text><text x="72" y="122" class="v">O lucro caiu; a capacidade de absorver risco é o teste</text><rect x="72" y="180" width="300" height="240" rx="22" fill="#102c4b" stroke="#2d6990"/><text x="102" y="226" class="k">Prêmios ganhos</text><text x="102" y="290" class="v">US$ 15,09 bi</text><text x="102" y="330" class="s">base da margem técnica</text><text x="102" y="370" class="n">+3,8% ante 3T25</text><rect x="450" y="180" width="300" height="240" rx="22" fill="#3a2136" stroke="#9d506e"/><text x="480" y="226" class="k">Catástrofes</text><text x="480" y="290" class="v">US$ 1,65 bi</text><text x="480" y="330" class="s">pressão sobre sinistros</text><text x="480" y="370" class="n">vs. US$ 558 mi em 3T25</text><rect x="828" y="180" width="300" height="240" rx="22" fill="#163b36" stroke="#4c9e89"/><text x="858" y="226" class="k">Capital</text><text x="858" y="290" class="v">US$ 32,31 bi</text><text x="858" y="330" class="s">patrimônio líquido</text><text x="858" y="370" class="n">em 30/09/2026</text><path d="M372 300H430" stroke="#78dfc1" stroke-width="8"/><path d="M750 300H808" stroke="#78dfc1" stroke-width="8"/><text x="72" y="510" class="k">Pergunta para as próximas divulgações</text><text x="72" y="555" class="s">Prêmios, reservas e resseguro absorvem um clima mais caro sem deteriorar a margem técnica?</text></svg>
