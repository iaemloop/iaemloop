<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PLPL3 — construção civil, margem e teste de ciclo</title>
  <desc id="desc">Diagrama IA em Loop sobre PLPL3, ranking Magic Formula, margem, preço médio e riscos do ciclo imobiliário.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#06080D"/>
      <stop offset="55%" stop-color="#13202B"/>
      <stop offset="100%" stop-color="#19364D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#E4D17F"/>
      <stop offset="100%" stop-color="#AA8451"/>
    </linearGradient>
    <style>
      .small{font:600 24px Inter,Arial,sans-serif;fill:#94a3b8}.label{font:700 30px Inter,Arial,sans-serif;fill:#e2e8f0}.big{font:800 58px Inter,Arial,sans-serif;fill:#fff}.gold{fill:#E4D17F}.cyan{fill:#6EE4EF}.muted{fill:#cbd5e1}.box{fill:rgba(6,8,13,.55);stroke:rgba(228,209,127,.28);stroke-width:2}.warn{fill:rgba(170,132,81,.18);stroke:#AA8451;stroke-width:2}.line{stroke:#6EE4EF;stroke-width:8;fill:none;stroke-linecap:round}.dash{stroke:#E4D17F;stroke-width:4;stroke-dasharray:12 10;fill:none}.dot{fill:#E4D17F;stroke:#06080D;stroke-width:5}
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="105" r="220" fill="#6EE4EF" opacity="0.07"/>
  <circle cx="180" cy="555" r="240" fill="#E4D17F" opacity="0.08"/>
  <text x="70" y="80" class="small gold">IA em Loop • 08/07/2026</text>
  <text x="70" y="145" class="big">PLPL3: barato, mas cíclico</text>
  <text x="70" y="190" class="label muted">Ranking forte + queda na carteira real exigem prova de margem e vendas</text>

  <rect x="70" y="245" width="255" height="130" rx="18" class="box"/>
  <text x="95" y="292" class="small">Magic Formula</text>
  <text x="95" y="348" class="big gold">#3</text>

  <rect x="355" y="245" width="255" height="130" rx="18" class="box"/>
  <text x="380" y="292" class="small">P/L Fundamentus</text>
  <text x="380" y="348" class="big gold">4,70</text>

  <rect x="640" y="245" width="255" height="130" rx="18" class="box"/>
  <text x="665" y="292" class="small">ROIC</text>
  <text x="665" y="348" class="big cyan">29,4%</text>

  <rect x="925" y="245" width="205" height="130" rx="18" class="warn"/>
  <text x="950" y="292" class="small">vs. PM carteira</text>
  <text x="950" y="348" class="big gold">-34%</text>

  <path d="M 125 510 C 250 430, 365 565, 505 470 S 780 420, 1040 500" class="line" opacity="0.9"/>
  <path d="M 125 450 H 1075" class="dash" opacity="0.75"/>
  <circle cx="125" cy="510" r="13" class="dot"/>
  <circle cx="505" cy="470" r="13" class="dot"/>
  <circle cx="1040" cy="500" r="13" class="dot"/>
  <text x="120" y="555" class="small">custo real R$ 11,81</text>
  <text x="395" y="430" class="small">cotação R$ 7,74</text>
  <text x="800" y="555" class="small">teste: margem + velocidade de vendas</text>
  <text x="70" y="610" class="small muted">Leitura: assimetria existe, mas o ciclo imobiliário decide se é oportunidade ou armadilha.</text>
</svg>
