<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6EE4EF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E4D17F;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="#06080D"/>
  
  <!-- 5G towers -->
  <g transform="translate(100, 250)">
    <!-- Tower 1 -->
    <rect x="0" y="-80" width="4" height="80" fill="#E4D17F"/>
    <circle cx="2" cy="-90" r="6" fill="#E4D17F"/>
    <rect x="-6" y="-100" width="16" height="4" fill="#E4D17F"/>
    <rect x="-10" y="-110" width="24" height="4" fill="#E4D17F"/>
    <rect x="-14" y="-120" width="32" height="4" fill="#E4D17F"/>
    <!-- Signal waves -->
    <path d="M 2 -90 q 20 -15 40 0" stroke="#E4D17F" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M 2 -90 q 30 -25 60 0" stroke="#E4D17F" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <g transform="translate(300, 280)">
    <!-- Tower 2 -->
    <rect x="0" y="-60" width="4" height="60" fill="#6EE4EF"/>
    <circle cx="2" cy="-70" r="6" fill="#6EE4EF"/>
    <rect x="-6" y="-80" width="16" height="4" fill="#6EE4EF"/>
    <rect x="-10" y="-90" width="24" height="4" fill="#6EE4EF"/>
    <rect x="-14" y="-100" width="32" height="4" fill="#6EE4EF"/>
    <!-- Signal waves -->
    <path d="M 2 -70 q 20 -15 40 0" stroke="#6EE4EF" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M 2 -70 q 30 -25 60 0" stroke="#6EE4EF" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <g transform="translate(500, 260)">
    <!-- Tower 3 -->
    <rect x="0" y="-70" width="4" height="70" fill="#E4D17F"/>
    <circle cx="2" cy="-80" r="6" fill="#E4D17F"/>
    <rect x="-6" y="-90" width="16" height="4" fill="#E4D17F"/>
    <rect x="-10" y="-100" width="24" height="4" fill="#E4D17F"/>
    <rect x="-14" y="-110" width="32" height="4" fill="#E4D17F"/>
    <!-- Signal waves -->
    <path d="M 2 -80 q 20 -15 40 0" stroke="#E4D17F" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M 2 -80 q 30 -25 60 0" stroke="#E4D17F" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- Mobile devices -->
  <g transform="translate(200, 320)">
    <rect x="-15" y="0" width="30" height="50" rx="5" fill="#19364D"/>
    <rect x="-10" y="5" width="20" height="35" rx="3" fill="#06080D"/>
    <circle cx="0" cy="25" r="8" fill="#E4D17F"/>
    <text x="0" y="35" text-anchor="middle" fill="#06080D" font-size="10">5G</text>
    <rect x="-8" y="-10" width="16" height="8" rx="2" fill="#6EE4EF"/>
  </g>
  
  <g transform="translate(400, 340)">
    <rect x="-12" y="0" width="24" height="40" rx="4" fill="#19364D"/>
    <rect x="-8" y="5" width="16" height="30" rx="2" fill="#06080D"/>
    <circle cx="0" cy="20" r="6" fill="#E4D17F"/>
    <text x="0" y="28" text-anchor="middle" fill="#06080D" font-size="8">VIV</text>
    <rect x="-6" y="-8" width="12" height="6" rx="1" fill="#6EE4EF"/>
  </g>
  
  <!-- Chart showing profit trend -->
  <g transform="translate(600, 100)">
    <text x="0" y="-20" fill="#E4D17F" font-size="14" font-weight="600">Lucro 1T26: R$ 1,3 bi</text>
    <rect x="0" y="0" width="150" height="100" fill="rgba(25,54,77,0.5)"/>
    <!-- Profit bars -->
    <rect x="20" y="40" width="20" height="40" fill="#6EE4EF"/>
    <rect x="55" y="20" width="20" height="60" fill="#E4D17F"/>
    <rect x="90" y="30" width="20" height="50" fill="#6EE4EF"/>
    <text x="15" y="105" fill="#94a3b8" font-size="10">4T25</text>
    <text x="50" y="105" fill="#94a3b8" font-size="10">1T26</text>
    <text x="85" y="105" fill="#94a3b8" font-size="10">Proj.</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="url(#grad1)" font-size="24" font-weight="700">
    VIVT3: Telecomunicações e IA na Era do 5G
  </text>
  
  <!-- Metrics -->
  <g transform="translate(50, 300)">
    <text x="0" y="0" fill="#94a3b8" font-size="12">P/VP: 1,57</text>
    <text x="0" y="20" fill="#94a3b8" font-size="12">Div. Yield: 7,2%</text>
    <text x="0" y="40" fill="#94a3b8" font-size="12">ROIC: 8,8%</text>
    <text x="0" y="60" fill="#94a3b8" font-size="12">BESST Score: 41,8</text>
  </g>
</svg>