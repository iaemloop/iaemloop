<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PGR, Progressive e o teste do ciclo de seguros auto</title>
  <desc id="desc">Visual IA em Loop com ranking Magic Formula EUA, custódia real, valuation, prêmio, sinistros e risco de normalização.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#06080D"/>
      <stop offset="50%" stop-color="#122334"/>
      <stop offset="100%" stop-color="#06080D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#6EE4EF"/>
      <stop offset="100%" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="110" r="190" fill="#6EE4EF" opacity="0.07"/>
  <circle cx="110" cy="560" r="210" fill="#E4D17F" opacity="0.08"/>
  <text x="72" y="82" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">IA em Loop • Stock EUA • Magic Formula</text>
  <text x="72" y="158" fill="url(#gold)" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="900">PGR / Progressive</text>
  <text x="72" y="212" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">seguradora barata ou lucro no pico?</text>
  <g filter="url(#shadow)">
    <rect x="72" y="270" width="300" height="150" rx="18" fill="#111B26" stroke="#E4D17F" stroke-opacity="0.32"/>
    <text x="96" y="316" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Ranking local</text>
    <text x="96" y="368" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900">#3 MF EUA</text>
    <text x="96" y="398" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="18">P/L 11,74 • ROIC 37,9%</text>
    <rect x="410" y="270" width="300" height="150" rx="18" fill="#111B26" stroke="#6EE4EF" stroke-opacity="0.28"/>
    <text x="434" y="316" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Custódia real</text>
    <text x="434" y="368" fill="#6EE4EF" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900">US$ 29,24</text>
    <text x="434" y="398" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="18">0,12758597 ação • PM US$ 229,1788</text>
    <rect x="748" y="270" width="300" height="150" rx="18" fill="#111B26" stroke="#E4D17F" stroke-opacity="0.32"/>
    <text x="772" y="316" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">SEC 1T26</text>
    <text x="772" y="368" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900">US$ 22,2 bi</text>
    <text x="772" y="398" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="18">receita • lucro US$ 2,8 bi</text>
  </g>
  <g transform="translate(92 480)">
    <rect x="0" y="0" width="1016" height="74" rx="16" fill="#0B111A" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="45" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Tese:</text>
    <text x="102" y="45" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="24">crescimento de prêmios e caixa forte vs. sinistralidade, tarifa e normalização do ciclo</text>
  </g>
  <text x="72" y="592" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="18">Conteúdo educacional, sem recomendação personalizada de investimento.</text>
</svg>
