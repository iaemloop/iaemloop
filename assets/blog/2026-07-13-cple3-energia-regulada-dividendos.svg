<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CPLE3: energia regulada, dividendos e teste de crescimento</title>
  <desc id="desc">Diagrama IA em Loop com os principais indicadores de CPLE3: posição BESST, preço, preço médio, P/L, P/VP, ROIC e pontos de acompanhamento.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080D"/>
      <stop offset="0.55" stop-color="#102234"/>
      <stop offset="1" stop-color="#2A2114"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6EE4EF"/>
      <stop offset="1" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="210" fill="#E4D17F" opacity="0.08"/>
  <circle cx="120" cy="520" r="230" fill="#6EE4EF" opacity="0.07"/>
  <rect x="70" y="70" width="1060" height="490" rx="34" fill="#131D27" opacity="0.86" stroke="#E4D17F" stroke-opacity="0.24" filter="url(#shadow)"/>
  <text x="105" y="130" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">IA em Loop • leitura diária • BESST</text>
  <text x="105" y="190" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">CPLE3</text>
  <text x="105" y="250" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">energia regulada ou valuation esticado?</text>
  <text x="105" y="306" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="25">Copel está na carteira real BESST e exige separar qualidade defensiva de preço já reprecificado.</text>

  <g transform="translate(105 350)">
    <rect width="210" height="120" rx="18" fill="#06080D" opacity="0.58" stroke="#6EE4EF" stroke-opacity="0.20"/>
    <text x="22" y="42" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">BESST</text>
    <text x="22" y="83" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">#7</text>
  </g>
  <g transform="translate(345 350)">
    <rect width="210" height="120" rx="18" fill="#06080D" opacity="0.58" stroke="#6EE4EF" stroke-opacity="0.20"/>
    <text x="22" y="42" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Preço consultado</text>
    <text x="22" y="83" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">R$ 15,53</text>
  </g>
  <g transform="translate(585 350)">
    <rect width="210" height="120" rx="18" fill="#06080D" opacity="0.58" stroke="#6EE4EF" stroke-opacity="0.20"/>
    <text x="22" y="42" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Preço médio</text>
    <text x="22" y="83" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">R$ 14,40</text>
  </g>
  <g transform="translate(825 350)">
    <rect width="210" height="120" rx="18" fill="#06080D" opacity="0.58" stroke="#6EE4EF" stroke-opacity="0.20"/>
    <text x="22" y="42" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">P/L • P/VP</text>
    <text x="22" y="83" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">17,06 • 1,94</text>
  </g>
  <path d="M105 515 H1035" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <text x="105" y="548" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="22">Gatilhos: reajustes, eficiência, alavancagem, dividendos e execução pós-privatização.</text>
</svg>
