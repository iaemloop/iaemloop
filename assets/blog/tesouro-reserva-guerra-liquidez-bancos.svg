<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Tesouro Reserva e guerra pela liquidez</title>
  <desc id="desc">Diagrama IA em Loop sobre reserva de emergência, Tesouro Reserva, caixinhas, bancos e funding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080D"/>
      <stop offset="0.52" stop-color="#10283B"/>
      <stop offset="1" stop-color="#2D2112"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6EE4EF"/>
      <stop offset="1" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="95" r="190" fill="#6EE4EF" opacity="0.08"/>
  <circle cx="135" cy="555" r="210" fill="#E4D17F" opacity="0.08"/>
  <text x="70" y="84" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">IA em Loop</text>
  <text x="70" y="150" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="900">Tesouro Reserva</text>
  <text x="70" y="210" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800">não é só renda fixa</text>
  <text x="70" y="260" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="25">É disputa por liquidez, confiança e fricção.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="322" width="300" height="150" rx="22" fill="rgba(6,8,13,.62)" stroke="#6EE4EF" stroke-opacity=".45"/>
    <text x="100" y="372" fill="#6EE4EF" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">Reserva</text>
    <text x="100" y="414" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="22">Liquidez antes</text>
    <text x="100" y="447" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="22">de CDI bonito</text>
    <rect x="450" y="322" width="300" height="150" rx="22" fill="rgba(6,8,13,.62)" stroke="#E4D17F" stroke-opacity=".5"/>
    <text x="480" y="372" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">Tesouro</text>
    <text x="480" y="414" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="22">R$ 1, Selic, Pix</text>
    <text x="480" y="447" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="22">e operação 24/7</text>
    <rect x="830" y="322" width="300" height="150" rx="22" fill="rgba(6,8,13,.62)" stroke="#AA8451" stroke-opacity=".55"/>
    <text x="860" y="372" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">Bancos</text>
    <text x="860" y="414" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="22">Funding, risco</text>
    <text x="860" y="447" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="22">e competição</text>
  </g>
  <path d="M380 397 H438" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
  <path d="M760 397 H818" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
  <text x="70" y="560" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22">Ranking aponta preço. Liquidez, funding e inadimplência contam a história.</text>
</svg>