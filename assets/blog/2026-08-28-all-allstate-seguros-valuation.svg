<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ALL, Allstate, seguros e valuation</title>
  <desc id="desc">Diagrama IA em Loop sobre Allstate nos rankings dolarizados, seguros patrimoniais, lucro, patrimônio líquido, compra em carteira e riscos de sinistralidade.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#06101a"/><stop offset="0.55" stop-color="#102236"/><stop offset="1" stop-color="#2b2212"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#6EE4EF"/><stop offset="1" stop-color="#E4D17F"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1040" cy="110" r="230" fill="#6EE4EF" opacity="0.08"/>
  <circle cx="150" cy="620" r="270" fill="#E4D17F" opacity="0.07"/>
  <rect x="72" y="64" width="1056" height="547" rx="32" fill="#131D27" opacity="0.88" stroke="#E4D17F" stroke-opacity="0.28" filter="url(#shadow)"/>
  <text x="98" y="125" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#6EE4EF">IA em Loop • Stock EUA em carteira</text>
  <text x="98" y="215" font-family="Inter, Arial, sans-serif" font-size="70" font-weight="900" fill="url(#gold)">ALL</text>
  <text x="98" y="278" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff">Allstate: seguro barato ou lucro no pico?</text>
  <text x="100" y="345" font-family="Inter, Arial, sans-serif" font-size="27" fill="#cbd5e1">A ação combina P/L baixo, ROE alto e exposição direta ao ciclo de sinistros.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">
    <rect x="98" y="402" width="178" height="62" rx="18" fill="#0f2538" stroke="#6EE4EF" stroke-opacity="0.45"/><text x="123" y="442" fill="#E4D17F">P/L 5,3x</text>
    <rect x="301" y="402" width="230" height="62" rx="18" fill="#0f2538" stroke="#6EE4EF" stroke-opacity="0.45"/><text x="326" y="442" fill="#E4D17F">Magic Formula #2</text>
    <rect x="556" y="402" width="206" height="62" rx="18" fill="#0f2538" stroke="#6EE4EF" stroke-opacity="0.45"/><text x="581" y="442" fill="#E4D17F">ROE 45,2%</text>
    <rect x="787" y="402" width="266" height="62" rx="18" fill="#0f2538" stroke="#6EE4EF" stroke-opacity="0.45"/><text x="812" y="442" fill="#E4D17F">sinistro manda</text>
  </g>
  <text x="98" y="532" font-family="Inter, Arial, sans-serif" font-size="24" fill="#94a3b8">Tese: disciplina de preço em seguros contra risco de catástrofes, competição e ciclo de underwriting.</text>
</svg>
