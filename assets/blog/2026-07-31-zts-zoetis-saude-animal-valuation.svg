<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ZTS, Zoetis e o teste da saúde animal</title>
  <desc id="desc">Visual IA em Loop para análise educacional de ZTS, com ranking, custódia, preço, receita, lucro e riscos da tese.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080D"/>
      <stop offset="0.55" stop-color="#102335"/>
      <stop offset="1" stop-color="#2A1F12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE4EF"/>
      <stop offset="1" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="190" fill="#E4D17F" opacity="0.08"/>
  <circle cx="140" cy="560" r="230" fill="#6EE4EF" opacity="0.07"/>
