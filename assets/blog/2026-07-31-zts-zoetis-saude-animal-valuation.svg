    <rect x="450" y="425" width="300" height="86" rx="16" fill="#06080D" opacity="0.62" stroke="#E4D17F" stroke-opacity="0.18"/>
    <text x="472" y="458" fill="#94a3b8" font-size="18" font-weight="700">Lucro líquido 1T26</text>
    <text x="472" y="492" fill="#e2e8f0" font-size="30" font-weight="900">US$ 601 mi</text>
    <rect x="800" y="425" width="300" height="86" rx="16" fill="#06080D" opacity="0.62" stroke="#E4D17F" stroke-opacity="0.18"/>
