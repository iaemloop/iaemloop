    <text x="472" y="348" fill="#94a3b8" font-size="18" font-weight="700">Carteira real</text>
    <text x="472" y="382" fill="#E4D17F" font-size="30" font-weight="900">US$ 48,73 • 50%</text>
    <rect x="800" y="315" width="300" height="86" rx="16" fill="#06080D" opacity="0.62" stroke="#6EE4EF" stroke-opacity="0.18"/>
    <text x="822" y="348" fill="#94a3b8" font-size="18" font-weight="700">Preço consultado</text>
    <text x="822" y="382" fill="#E4D17F" font-size="30" font-weight="900">US$ 76,29</text>
    <rect x="100" y="425" width="300" height="86" rx="16" fill="#06080D" opacity="0.62" stroke="#E4D17F" stroke-opacity="0.18"/>
    <text x="122" y="458" fill="#94a3b8" font-size="18" font-weight="700">Receita 1T26</text>
