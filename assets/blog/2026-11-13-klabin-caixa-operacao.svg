<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Klabin: capital, dívida e caixa não são a mesma conta</title><desc id="desc">Aporte florestal de 1,2 bilhão de reais condicionado ao fechamento; financiamento contratado de 150 milhões de dólares; caixa livre de 73 milhões de reais no terceiro trimestre, na definição da companhia, após proventos.</desc><rect width="1200" height="660" rx="24" fill="#101923"/><g font-family="Arial,sans-serif"><text x="60" y="72" font-size="23" fill="#b8ee74">IA EM LOOP · KLABIN · NOVEMBRO DE 2026</text><text x="60" y="133" font-size="42" font-weight="700" fill="#f3f5f8">Três contas. Três significados.</text><text x="60" y="178" font-size="24" fill="#aebdcc">Liquidez anunciada não comprova geração recorrente.</text><rect x="60" y="220" width="340" height="296" rx="18" fill="#1b2936"/><rect x="430" y="220" width="340" height="296" rx="18" fill="#1b2936"/><rect x="800" y="220" width="340" height="296" rx="18" fill="#1b2936"/><text x="84" y="267" font-size="22" fill="#aebdcc">ACORDO FLORESTAL</text><text x="84" y="335" font-size="41" fill="#b8ee74" font-weight="700">R$ 1,2 bilhão</text><text x="84" y="387" font-size="23" fill="#f3f5f8">Aporte previsto</text><text x="84" y="424" font-size="22" fill="#aebdcc">Depende do fechamento</text><text x="84" y="478" font-size="20" fill="#aebdcc">Comunicado · 06/11/2026</text><text x="454" y="267" font-size="22" fill="#aebdcc">FINANCIAMENTO</text><text x="454" y="335" font-size="38" fill="#73d8e6" font-weight="700">US$ 150 milhões</text><text x="454" y="387" font-size="23" fill="#f3f5f8">Dívida contratada</text><text x="454" y="424" font-size="22" fill="#aebdcc">Não é receita operacional</text><text x="454" y="478" font-size="20" fill="#aebdcc">Comunicado · 09/11/2026</text><text x="824" y="267" font-size="22" fill="#aebdcc">CAIXA LIVRE · 3T26</text><text x="824" y="335" font-size="41" fill="#f7cb77" font-weight="700">R$ 73 milhões</text><text x="824" y="387" font-size="23" fill="#f3f5f8">Definição gerencial</text><text x="824" y="424" font-size="22" fill="#aebdcc">Após proventos e capex</text><text x="824" y="478" font-size="20" fill="#aebdcc">Trimestre · jul–set/2026</text><text x="60" y="564" font-size="22" fill="#aebdcc">Não somar: moedas, períodos e naturezas diferentes.</text><text x="60" y="606" font-size="20" fill="#aebdcc">Fontes: comunicados da Klabin e divulgação do 3T26, página 25.</text></g></svg>