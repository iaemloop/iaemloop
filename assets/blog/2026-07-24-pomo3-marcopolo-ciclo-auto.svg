<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">POMO3, Marcopolo e o teste do ciclo automotivo</title>
  <desc id="desc">Diagrama IA em Loop sobre POMO3, ranking Magic Formula, valuation, dividendos, exportação e riscos de ciclo automotivo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06080D"/>
      <stop offset="55%" stop-color="#132133"/>
      <stop offset="100%" stop-color="#2b1f13"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6EE4EF"/>
      <stop offset="100%" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="88" r="190" fill="#6EE4EF" opacity="0.07"/>
  <circle cx="160" cy="560" r="210" fill="#E4D17F" opacity="0.08"/>
  <text x="72" y="82" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">IA em Loop • leitura educacional</text>
  <text x="72" y="150" fill="url(#gold)" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800">POMO3</text>
  <text x="72" y="210" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">Marcopolo e o teste do ciclo</text>
  <text x="72" y="258" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="25">Barata no ranking, mas dependente de ônibus, exportação e margem.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="314" width="260" height="128" rx="18" fill="#101827" stroke="#E4D17F" stroke-opacity="0.35"/>
    <text x="96" y="356" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Magic Formula</text>
    <text x="96" y="404" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">#13</text>
    <text x="160" y="404" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="22">score 47</text>

    <rect x="362" y="314" width="260" height="128" rx="18" fill="#101827" stroke="#6EE4EF" stroke-opacity="0.28"/>
    <text x="386" y="356" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Retorno operacional</text>
    <text x="386" y="404" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">20,1%</text>
    <text x="498" y="404" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="22">ROIC</text>

    <rect x="652" y="314" width="260" height="128" rx="18" fill="#101827" stroke="#E4D17F" stroke-opacity="0.35"/>
    <text x="676" y="356" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Valuation</text>
    <text x="676" y="404" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">4,83x</text>
    <text x="790" y="404" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="22">P/L</text>
  </g>

  <g transform="translate(86 500)">
    <rect x="0" y="0" width="1028" height="70" rx="18" fill="#0b1220" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="28" y="43" fill="#6EE4EF" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">Pergunta central:</text>
    <text x="236" y="43" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="23">qualidade cíclica em promoção ou dividendo alto no pico do ciclo?</text>
  </g>
</svg>
