<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" role="img" aria-label="Diagrama IA em Loop sobre o Itaú Unibanco: lucro recorrente do 3T26, carteira de crédito, ROE, custo do crédito e patrimônio">
  <defs>
    <style>
      .t{font:600 13px 'Inter',system-ui,sans-serif;fill:#94a3b8;}
      .b{font:700 15px 'Inter',system-ui,sans-serif;fill:#ffffff;}
      .m{font:600 14px 'Inter',system-ui,sans-serif;fill:#e4d17f;}
      .s{font:600 12px 'Inter',system-ui,sans-serif;fill:#cbd5e1;}
      .box{fill:#131d27;stroke:rgba(228,209,127,0.2);stroke-width:1;rx:10;ry:10;}
      .accent{stroke:#e4d17f;stroke-width:1.5;}
    </style>
  </defs>
  <rect width="940" height="640" fill="#06080d"/>
  <g transform="translate(40,30)">
    <rect x="0" y="0" width="260" height="460" class="box accent"/>
    <text x="20" y="46" class="b">Resultado recorrente</text>
    <text x="20" y="66" class="b">gerencial 3T26</text>
    <text x="20" y="96" class="b">R$ 12,617 bi</text>
    <text x="20" y="120" class="s">+1,7% t/t · +6,2% a/a</text>
    <text x="20" y="150" class="b">Lucro líquido</text>
    <text x="20" y="170" class="b">contábil</text>
    <text x="20" y="194" class="b">R$ 12,3 bi</text>
    <text x="20" y="218" class="s">+5,8% a/a · lucro por</text>
    <text x="20" y="238" class="s">ação R$ 1,11</text>
    <rect x="0" y="260" width="260" height="100" class="box"/>
    <text x="20" y="286" class="m">ROE recorrente</text>
    <text x="20" y="310" class="b">23,6%</text>
    <text x="20" y="334" class="s">patrimônio líquido:</text>
    <text x="20" y="354" class="s">R$ 219,9 bi</text>
    <text x="20" y="378" class="s">CET1: 12,7% (+0,4 pp t/t)</text>
    <rect x="0" y="390" width="260" height="140" class="box"/>
    <text x="20" y="416" class="m">Carteira de crédito</text>
    <text x="20" y="436" class="m">total</text>
    <text x="20" y="460" class="b">R$ 1,544 trilhão</text>
    <text x="20" y="484" class="s">+2,2% t/t excluindo Colômbia</text>
    <text x="20" y="508" class="s">+10,9% a/a</text>
    <text x="20" y="532" class="s">imobiliário, consignado</text>
    <text x="20" y="552" class="s">e MPME na frente</text>

    <rect x="320" y="0" width="540" height="210" class="box accent"/>
    <text x="340" y="46" class="b">Margem financeira e</text>
    <text x="340" y="66" class="b">produto bancário</text>
    <text x="340" y="96" class="m">Margem financeira</text>
    <text x="340" y="120" class="b">R$ 30,3 bi</text>
    <text x="340" y="144" class="s">+9,2% a/a</text>
    <text x="470" y="120" class="b">R$ 48,4 bi</text>
    <text x="470" y="144" class="s">produto bancário (+11,4% a/a)</text>
    <text x="340" y="174" class="m">Custo do crédito</text>
    <text x="340" y="198" class="b">R$ 10,4 bi</text>
    <text x="340" y="222" class="s">+2,7% t/t · inadimplência</text>
    <text x="340" y="242" class="s">>90 dias: 2,0%</text>

    <rect x="320" y="260" width="540" height="230" class="box accent"/>
    <text x="340" y="286" class="b">O que muda na estrutura</text>
    <text x="340" y="310" class="m">Saída do varejo PF da</text>
    <text x="340" y="330" class="m">Colômbia</text>
    <text x="340" y="354" class="s">concluída em julho de 2026</text>
    <text x="340" y="378" class="m">Impacto no trimestre</text>
    <text x="340" y="402" class="b">prejuízo de R$ 291 mi</text>
    <text x="340" y="426" class="s">mais R$ 133 mi de</text>
    <text x="340" y="446" class="s">amortização de ágio</text>
    <text x="340" y="470" class="m">Guidance de alíquota</text>
    <text x="340" y="490" class="m">IR/CS 2026</text>
    <text x="340" y="514" class="b">28% a 29%</text>
    <text x="340" y="538" class="s">revisado de 29,5% a 32,5%</text>

    <rect x="320" y="260" width="220" height="1" fill="rgba(228,209,127,0.2)"/>
    <rect x="560" y="260" width="280" height="1" fill="rgba(228,209,127,0.2)"/>
  </g>
  <text x="40" y="555" class="s">Fonte: resultado e MD&amp;A do Itaú Unibanco do 3T26, divulgados em 03/11/2026 (relações com investidores). Conteúdo educacional, não recomendação de investimento.</text>
</svg>
