<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Diagrama IA em Loop sobre o Itaú Unibanco: lucro recorrente do 3T26, carteira de crédito, ROE, custo do crédito e patrimônio">
  <defs>
    <style>
      .t{font:600 13px 'Inter',system-ui,sans-serif;fill:#94a3b8;}
      .b{font:700 15px 'Inter',system-ui,sans-serif;fill:#ffffff;}
      .m{font:600 14px 'Inter',system-ui,sans-serif;fill:#e4d17f;}
      .s{font:600 12px 'Inter',system-ui,sans-serif;fill:#cbd5e1;}
      .box{fill:#131d27;stroke:rgba(228,209,127,0.2);stroke-width:1;rx:10;ry:10;}
      .accent{stroke:#e4d17f;stroke-width:1.5;}
    </style>
  </defs>
  <rect width="900" height="520" fill="#06080d"/>
  <g transform="translate(40,30)">
    <!-- Coluna esquerda — uma caixa só, fechada -->
    <rect x="0" y="0" width="260" height="496" class="box accent"/>
    <text x="20" y="46" class="b">Resultado</text>
    <text x="20" y="62" class="b">recorrente</text>
    <text x="20" y="78" class="b">gerencial 3T26</text>
    <text x="20" y="104" class="b">R$ 12,617 bi</text>
    <text x="20" y="120" class="s">+1,7% t/t · +6,2% a/a</text>
    <text x="20" y="146" class="b">Lucro líquido</text>
    <text x="20" y="156" class="b">contábil</text>
    <text x="20" y="172" class="b">R$ 12,3 bi</text>
    <text x="20" y="192" class="s">+5,8% a/a · por</text>
    <text x="20" y="208" class="s">ação R$ 1,11</text>
    <text x="20" y="234" class="m">ROE recorrente</text>
    <text x="20" y="250" class="b">23,6%</text>
    <text x="20" y="270" class="s">patrimônio líquido:</text>
    <text x="20" y="286" class="s">R$ 219,9 bi</text>
    <text x="20" y="302" class="s">CET1: 12,7%</text>
    <text x="20" y="328" class="m">Carteira de crédito</text>
    <text x="20" y="344" class="m">total</text>
    <text x="20" y="360" class="b">R$ 1,544 tri</text>
    <text x="20" y="376" class="s">+2,2% t/t excl. Colômbia</text>
    <text x="20" y="392" class="s">+10,9% a/a</text>
    <text x="20" y="408" class="s">imob., consignado, MPME</text>

    <!-- Coluna direita superior -->
    <rect x="320" y="0" width="540" height="210" class="box accent"/>
    <text x="340" y="46" class="b">Margem financeira e</text>
    <text x="340" y="62" class="b">produto bancário</text>
    <text x="340" y="88" class="m">Margem financeira</text>
    <text x="340" y="104" class="b">R$ 30,3 bi</text>
    <text x="340" y="120" class="s">+9,2% a/a</text>
    <text x="470" y="104" class="b">R$ 48,4 bi</text>
    <text x="470" y="120" class="s">produto bancário (+11,4% a/a)</text>
    <text x="340" y="146" class="m">Custo do crédito</text>
    <text x="340" y="162" class="b">R$ 10,4 bi</text>
    <text x="340" y="178" class="s">+2,7% t/t · >90 dias: 2,0%</text>

    <!-- Coluna direita inferior -->
    <rect x="320" y="230" width="540" height="230" class="box accent"/>
    <text x="340" y="256" class="b">O que muda na</text>
    <text x="340" y="272" class="b">estrutura</text>
    <text x="340" y="292" class="m">Saída varejo PF Colômbia</text>
    <text x="340" y="308" class="s">concluída em jul/2026</text>
    <text x="340" y="328" class="m">Impacto no trimestre</text>
    <text x="340" y="344" class="b">prejuízo R$ 291 mi</text>
    <text x="340" y="360" class="s">mais R$ 133 mi ágio</text>
    <text x="340" y="380" class="m">Guidance alíquota IR/CS</text>
    <text x="340" y="396" class="m">2026</text>
    <text x="340" y="412" class="b">28% a 29%</text>
    <text x="340" y="428" class="s">de 29,5% a 32,5%</text>

    <rect x="320" y="230" width="220" height="1" fill="rgba(228,209,127,0.2)"/>
    <rect x="560" y="230" width="280" height="1" fill="rgba(228,209,127,0.2)"/>
  </g>
  <text x="40" y="508" class="s">Fonte: resultado e MD&amp;A Itaú Unibanco 3T26, 03/11/2026 (RI). Conteúdo educacional, não recomendação de investimento.</text>
</svg>
