<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">CSED3, educação e IA no teste de margem</title>
  <desc id="desc">Diagrama escuro do IA em Loop conectando ranking Magic Formula, carteira real, ticket médio, retenção, inadimplência e uso de IA em educação.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080D"/>
      <stop offset="0.5" stop-color="#102437"/>
      <stop offset="1" stop-color="#2B2418"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6EE4EF"/>
      <stop offset="1" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#6EE4EF" stroke-width="1">
    <path d="M80 500 C220 410 330 430 470 310 S790 190 1090 120" fill="none"/>
    <path d="M90 130 C290 220 350 130 520 210 S810 350 1120 270" fill="none"/>
    <circle cx="180" cy="465" r="4" fill="#6EE4EF"/>
    <circle cx="472" cy="310" r="5" fill="#E4D17F"/>
    <circle cx="842" cy="184" r="4" fill="#6EE4EF"/>
    <circle cx="1020" cy="145" r="5" fill="#E4D17F"/>
  </g>
  <text x="70" y="82" font-family="Inter, Arial, sans-serif" font-size="26" fill="#94a3b8" font-weight="700">IA em Loop • Leitura diária • 25/05/2026</text>
  <text x="70" y="148" font-family="Inter, Arial, sans-serif" font-size="62" fill="url(#gold)" font-weight="800">CSED3 no teste</text>
  <text x="70" y="210" font-family="Inter, Arial, sans-serif" font-size="54" fill="#ffffff" font-weight="800">do aluno que fica</text>
  <text x="72" y="254" font-family="Inter, Arial, sans-serif" font-size="22" fill="#cbd5e1">Educação privada: múltiplo baixo só vira tese se margem, evasão e caixa confirmarem o ranking.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="315" width="240" height="145" rx="18" fill="rgba(6,8,13,0.72)" stroke="#E4D17F" stroke-opacity="0.35"/>
    <text x="94" y="358" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94a3b8" font-weight="700">Ranking</text>
    <text x="94" y="403" font-family="Inter, Arial, sans-serif" font-size="34" fill="#E4D17F" font-weight="800">Top 20</text>
    <text x="94" y="435" font-family="Inter, Arial, sans-serif" font-size="18" fill="#cbd5e1">Magic Formula</text>

    <rect x="345" y="315" width="240" height="145" rx="18" fill="rgba(6,8,13,0.72)" stroke="#6EE4EF" stroke-opacity="0.25"/>
    <text x="369" y="358" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94a3b8" font-weight="700">Carteira real</text>
    <text x="369" y="403" font-family="Inter, Arial, sans-serif" font-size="34" fill="#E4D17F" font-weight="800">CSED3</text>
    <text x="369" y="435" font-family="Inter, Arial, sans-serif" font-size="18" fill="#cbd5e1">posição pequena</text>

    <rect x="620" y="315" width="240" height="145" rx="18" fill="rgba(6,8,13,0.72)" stroke="#E4D17F" stroke-opacity="0.35"/>
    <text x="644" y="358" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94a3b8" font-weight="700">Preço observado</text>
    <text x="644" y="403" font-family="Inter, Arial, sans-serif" font-size="34" fill="#E4D17F" font-weight="800">R$ 4,21</text>
    <text x="644" y="435" font-family="Inter, Arial, sans-serif" font-size="18" fill="#cbd5e1">Fundamentus</text>

    <rect x="895" y="315" width="235" height="145" rx="18" fill="rgba(6,8,13,0.72)" stroke="#6EE4EF" stroke-opacity="0.25"/>
    <text x="919" y="358" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94a3b8" font-weight="700">Pergunta</text>
    <text x="919" y="398" font-family="Inter, Arial, sans-serif" font-size="30" fill="#E4D17F" font-weight="800">barato ou</text>
    <text x="919" y="432" font-family="Inter, Arial, sans-serif" font-size="30" fill="#E4D17F" font-weight="800">armadilha?</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="18" fill="#cbd5e1">
    <text x="86" y="535">IA útil aqui: prever evasão, ajustar bolsas, cobrar melhor, personalizar trilhas e proteger margem.</text>
    <text x="86" y="566" fill="#94a3b8">O ranking abre a porta; retenção, inadimplência e geração de caixa decidem se a porta fica aberta.</text>
  </g>
</svg>
