<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GGBR4, Gerdau e o teste do aço cíclico</title>
  <desc id="desc">Diagrama visual IA em Loop sobre GGBR4: ranking Barsi, valuation, dividendos, ciclo do aço, risco de margem e preço de mercado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06080D"/><stop offset="0.55" stop-color="#0F2231"/><stop offset="1" stop-color="#2A1F13"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6EE4EF"/><stop offset="1" stop-color="#E4D17F"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="190" fill="#E4D17F" opacity="0.08"/>
  <circle cx="80" cy="560" r="230" fill="#6EE4EF" opacity="0.07"/>
  <g filter="url(#shadow)">
    <rect x="70" y="66" width="1060" height="498" rx="30" fill="#111923" opacity="0.92" stroke="#E4D17F" stroke-opacity="0.28"/>
  </g>
  <text x="102" y="132" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">IA em Loop • Ação Brasil • GGBR4</text>
  <text x="102" y="196" fill="url(#gold)" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="900">Gerdau: preço bom ou ciclo no topo?</text>
  <text x="102" y="244" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="26">Siderurgia exige margem de segurança porque lucro, dólar, minério e demanda mudam juntos.</text>
  <g transform="translate(102 300)">
    <rect width="210" height="126" rx="18" fill="#071018" stroke="#6EE4EF" stroke-opacity="0.35"/>
    <text x="22" y="42" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Ranking Barsi</text>
    <text x="22" y="90" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900">#4</text>
  </g>
  <g transform="translate(342 300)">
    <rect width="210" height="126" rx="18" fill="#071018" stroke="#E4D17F" stroke-opacity="0.35"/>
    <text x="22" y="42" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">P/VP local</text>
    <text x="22" y="90" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900">0,98</text>
  </g>
  <g transform="translate(582 300)">
    <rect width="210" height="126" rx="18" fill="#071018" stroke="#22C55E" stroke-opacity="0.35"/>
    <text x="22" y="42" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">DY no ranking</text>
    <text x="22" y="90" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900">3,5%</text>
  </g>
  <g transform="translate(822 300)">
    <rect width="210" height="126" rx="18" fill="#071018" stroke="#F97316" stroke-opacity="0.35"/>
    <text x="22" y="42" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Preço consultado</text>
    <text x="22" y="90" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900">R$ 24,71</text>
  </g>
  <path d="M118 491 C 215 438, 302 455, 390 420 S 573 377, 675 414 S 855 487, 1034 447" fill="none" stroke="#6EE4EF" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  <path d="M118 516 C 228 484, 338 500, 456 468 S 673 443, 794 467 S 945 532, 1040 494" fill="none" stroke="#E4D17F" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <text x="102" y="555" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="18">Leitura educacional: margem de segurança precisa compensar ciclicidade, alavancagem operacional e dependência de demanda.</text>
</svg>
