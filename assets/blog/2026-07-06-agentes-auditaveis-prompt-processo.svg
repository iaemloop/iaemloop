<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Agentes auditáveis: prompt não é processo</title>
  <desc id="desc">Diagrama IA em Loop mostrando passagem de prompt solto para fluxo com contrato, ferramentas, permissões, evidência e limite de autonomia.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#050812"/><stop offset="55%" stop-color="#0d1f2d"/><stop offset="100%" stop-color="#172b22"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6EE4EF"/><stop offset="100%" stop-color="#E4D17F"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><circle cx="1020" cy="105" r="180" fill="#6EE4EF" opacity="0.08"/><circle cx="120" cy="540" r="220" fill="#E4D17F" opacity="0.08"/>
  <text x="70" y="82" fill="#94a3b8" font-family="Inter, Arial" font-size="24" font-weight="700">IA em Loop • IA operacional</text><text x="70" y="142" fill="#ffffff" font-family="Inter, Arial" font-size="52" font-weight="800">Prompt não é processo</text><text x="70" y="190" fill="#cbd5e1" font-family="Inter, Arial" font-size="25">Agente útil precisa de contrato, ferramenta, permissão, evidência e limite.</text>
  <g transform="translate(70,250)"><rect x="0" y="0" width="245" height="210" rx="22" fill="#07111d" stroke="#334155"/><text x="28" y="48" fill="#E4D17F" font-family="Inter, Arial" font-size="24" font-weight="800">Prompt solto</text><text x="28" y="92" fill="#cbd5e1" font-family="Inter, Arial" font-size="19">• intenção vaga</text><text x="28" y="124" fill="#cbd5e1" font-family="Inter, Arial" font-size="19">• sem checklist</text><text x="28" y="156" fill="#cbd5e1" font-family="Inter, Arial" font-size="19">• sem evidência</text><text x="28" y="188" fill="#fca5a5" font-family="Inter, Arial" font-size="18" font-weight="700">risco: teatro de IA</text></g>
  <path d="M345 355 C410 355 420 355 485 355" stroke="url(#gold)" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#glow)"/><path d="M465 330 L500 355 L465 380" fill="none" stroke="#E4D17F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(535,230)"><rect x="0" y="0" width="595" height="260" rx="26" fill="#07111d" stroke="#E4D17F" stroke-opacity="0.45"/><text x="32" y="52" fill="#ffffff" font-family="Inter, Arial" font-size="28" font-weight="800">Fluxo auditável</text><g font-family="Inter, Arial" font-size="20" fill="#cbd5e1"><text x="36" y="102">1. Contrato: objetivo, limite, dado permitido</text><text x="36" y="140">2. Ferramentas: ações reais, não só resposta</text><text x="36" y="178">3. Permissões: o que pode executar sozinho</text><text x="36" y="216">4. Evidência: log, fonte, antes/depois, revisão</text></g><rect x="350" y="42" width="190" height="48" rx="24" fill="#19364D" stroke="#6EE4EF" stroke-opacity="0.55"/><text x="382" y="74" fill="#6EE4EF" font-family="Inter, Arial" font-size="19" font-weight="800">produto útil</text></g>
  <text x="70" y="570" fill="#94a3b8" font-family="Inter, Arial" font-size="21">Privacidade, setup de projeto e automação só valem quando entregam resultado verificável.</text>
</svg>
