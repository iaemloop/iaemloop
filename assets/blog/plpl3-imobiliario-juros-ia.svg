<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PLPL3, construção civil, juros e IA no ciclo imobiliário</title>
  <desc id="desc">Diagrama visual IA em Loop mostrando PLPL3 no centro de ranking Magic Formula, ROIC, valuation, juros, crédito imobiliário e IA operacional.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06080d"/><stop offset="0.56" stop-color="#101d2b"/><stop offset="1" stop-color="#19364D"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4D17F"/><stop offset="1" stop-color="#AA8451"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="990" cy="120" r="230" fill="#6EE4EF" opacity="0.08"/>
  <circle cx="125" cy="515" r="260" fill="#E4D17F" opacity="0.08"/>
  <text x="70" y="82" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">IA em Loop • Leitura diária • 15/05/2026</text>
  <text x="70" y="150" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">PLPL3 em teste</text>
  <text x="70" y="205" fill="#6EE4EF" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">imóveis, juros e execução</text>
  <text x="72" y="252" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="22">Ranking é filtro: ROIC alto, preço razoável e risco de ciclo</text>
  <g filter="url(#shadow)"><rect x="70" y="310" width="250" height="125" rx="18" fill="#0b1220" stroke="#E4D17F" stroke-opacity="0.35"/><text x="96" y="354" fill="#94a3b8" font-family="Inter, Arial" font-size="18" font-weight="700">Magic Formula</text><text x="96" y="398" fill="#E4D17F" font-family="Inter, Arial" font-size="46" font-weight="800">#3</text></g>
  <g filter="url(#shadow)"><rect x="355" y="310" width="250" height="125" rx="18" fill="#0b1220" stroke="#6EE4EF" stroke-opacity="0.28"/><text x="381" y="354" fill="#94a3b8" font-family="Inter, Arial" font-size="18" font-weight="700">ROIC ranking</text><text x="381" y="398" fill="#6EE4EF" font-family="Inter, Arial" font-size="46" font-weight="800">29,26%</text></g>
  <g filter="url(#shadow)"><rect x="640" y="310" width="250" height="125" rx="18" fill="#0b1220" stroke="#E4D17F" stroke-opacity="0.35"/><text x="666" y="354" fill="#94a3b8" font-family="Inter, Arial" font-size="18" font-weight="700">P/L consultado</text><text x="666" y="398" fill="#E4D17F" font-family="Inter, Arial" font-size="46" font-weight="800">6,45</text></g>
  <g filter="url(#shadow)"><rect x="925" y="310" width="205" height="125" rx="18" fill="#0b1220" stroke="#6EE4EF" stroke-opacity="0.28"/><text x="951" y="354" fill="#94a3b8" font-family="Inter, Arial" font-size="18" font-weight="700">Risco-chave</text><text x="951" y="394" fill="#ffffff" font-family="Inter, Arial" font-size="30" font-weight="800">ciclo</text></g>
  <path d="M160 505 C 315 460, 432 535, 575 495 S 835 458, 1048 506" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <circle cx="160" cy="505" r="10" fill="#E4D17F"/><circle cx="575" cy="495" r="10" fill="#6EE4EF"/><circle cx="1048" cy="506" r="10" fill="#E4D17F"/>
  <text x="70" y="580" fill="#94a3b8" font-family="Inter, Arial" font-size="18">Espera ativa: acompanhar VSO, margem, caixa, distratos, crédito e Minha Casa Minha Vida.</text>
