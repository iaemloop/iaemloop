<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">GDDY, GoDaddy, domínios, IA e valuation</title>
  <desc id="desc">Diagrama IA em Loop sobre GoDaddy no ranking Magic Formula EUA, geração de caixa, recompras, dívida e risco de crescimento.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06101a"/>
      <stop offset="0.55" stop-color="#102236"/>
      <stop offset="1" stop-color="#2b2212"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#6EE4EF"/>
      <stop offset="1" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1030" cy="120" r="220" fill="#6EE4EF" opacity="0.08"/>
  <circle cx="170" cy="620" r="260" fill="#E4D17F" opacity="0.07"/>
  <rect x="72" y="64" width="1056" height="547" rx="32" fill="#131D27" opacity="0.88" stroke="#E4D17F" stroke-opacity="0.28" filter="url(#shadow)"/>
  <text x="98" y="125" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#6EE4EF">IA em Loop • Magic Formula EUA</text>
  <text x="98" y="215" font-family="Inter, Arial, sans-serif" font-size="70" font-weight="900" fill="url(#gold)">GDDY</text>
  <text x="98" y="278" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff">GoDaddy: domínio barato ou caixa em desaceleração?</text>
  <text x="100" y="345" font-family="Inter, Arial, sans-serif" font-size="27" fill="#cbd5e1">Ranking #1 pede leitura além do P/L: receita recorrente, dívida e recompras.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">
    <rect x="98" y="402" width="190" height="62" rx="18" fill="#0f2538" stroke="#6EE4EF" stroke-opacity="0.45"/>
    <text x="123" y="442" fill="#E4D17F">P/L 13,6x</text>
    <rect x="313" y="402" width="205" height="62" rx="18" fill="#0f2538" stroke="#6EE4EF" stroke-opacity="0.45"/>
    <text x="338" y="442" fill="#E4D17F">#1 no filtro</text>
    <rect x="543" y="402" width="238" height="62" rx="18" fill="#0f2538" stroke="#6EE4EF" stroke-opacity="0.45"/>
    <text x="568" y="442" fill="#E4D17F">caixa 1S26 forte</text>
    <rect x="806" y="402" width="250" height="62" rx="18" fill="#0f2538" stroke="#6EE4EF" stroke-opacity="0.45"/>
    <text x="831" y="442" fill="#E4D17F">dívida exige cautela</text>
  </g>
  <text x="98" y="532" font-family="Inter, Arial, sans-serif" font-size="24" fill="#94a3b8">Tese: presença digital recorrente + IA para pequenos negócios contra risco de preço já cobrar execução.</text>
</svg>
