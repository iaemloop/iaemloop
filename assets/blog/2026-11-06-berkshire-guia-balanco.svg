<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Berkshire: guia de leitura do balanço</title><desc id="desc">Diagrama educacional de três perguntas: operação, liquidez e alocação de capital. Não há previsão do resultado do terceiro trimestre.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08131e"/><stop offset="1" stop-color="#19364d"/></linearGradient></defs><rect width="1200" height="620" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="65" y="88" fill="#6ee4ef" font-size="29" font-weight="bold">BERKSHIRE · ANTES DO 3T26</text><text x="65" y="150" fill="#fff" font-size="42" font-weight="bold">Olhe além do lucro líquido</text><rect x="60" y="204" width="338" height="245" rx="18" fill="#142b3a" stroke="#6ee4ef" stroke-width="3"/><text x="86" y="260" fill="#6ee4ef" font-size="23">OPERAÇÃO</text><text x="86" y="324" fill="#fff" font-size="30" font-weight="bold">Margens e riscos</text><text x="86" y="374" fill="#d9e7ed" font-size="21">Seguros · BNSF · energia</text><rect x="430" y="204" width="338" height="245" rx="18" fill="#142b3a" stroke="#e4d17f" stroke-width="3"/><text x="456" y="260" fill="#e4d17f" font-size="23">LIQUIDEZ</text><text x="456" y="324" fill="#fff" font-size="30" font-weight="bold">Caixa e títulos</text><text x="456" y="374" fill="#d9e7ed" font-size="21">Obrigações e flexibilidade</text><rect x="800" y="204" width="340" height="245" rx="18" fill="#142b3a" stroke="#f0a889" stroke-width="3"/><text x="826" y="260" fill="#f0a889" font-size="23">ALOCAÇÃO</text><text x="826" y="324" fill="#fff" font-size="30" font-weight="bold">Uso do capital</text><text x="826" y="374" fill="#d9e7ed" font-size="21">Investir · comprar · recomprar</text><text x="65" y="519" fill="#fff" font-size="26" font-weight="bold">Dados anteriores não antecipam o próximo trimestre.</text><text x="65" y="562" fill="#b9d0d9" font-size="19">Fontes: comunicado e 10-Q oficiais · IA em Loop · 06/11/2026</text></g></svg>
