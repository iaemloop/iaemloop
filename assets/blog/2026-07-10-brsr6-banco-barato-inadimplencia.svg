<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">BRSR6, banco barato e teste de inadimplência</title>
  <desc id="desc">Diagrama IA em Loop com valuation, dividendos, carteira real e risco de crédito para Banrisul.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080D"/>
      <stop offset="0.55" stop-color="#102235"/>
      <stop offset="1" stop-color="#19364D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E4D17F"/>
      <stop offset="1" stop-color="#6EE4EF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="90" r="170" fill="#6EE4EF" opacity="0.08"/>
  <circle cx="170" cy="560" r="220" fill="#E4D17F" opacity="0.07"/>
  <text x="70" y="78" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">IA em Loop • Leitura diária • 10/07/2026</text>
  <text x="70" y="150" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="800">BRSR6</text>
  <text x="70" y="215" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">banco barato ou alerta de crédito?</text>
  <text x="70" y="266" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="25">Banrisul entrou na carteira real BESST com múltiplos baixos,</text>
  <text x="70" y="300" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="25">dividend yield alto e uma condição: inadimplência precisa estabilizar.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="350" width="250" height="130" rx="18" fill="#0B1220" opacity="0.92" stroke="#E4D17F" stroke-opacity="0.35"/>
    <text x="95" y="395" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">P/L</text>
    <text x="95" y="448" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">3,66</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="350" y="350" width="250" height="130" rx="18" fill="#0B1220" opacity="0.92" stroke="#E4D17F" stroke-opacity="0.35"/>
    <text x="375" y="395" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">P/VP</text>
    <text x="375" y="448" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">0,51</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="630" y="350" width="250" height="130" rx="18" fill="#0B1220" opacity="0.92" stroke="#E4D17F" stroke-opacity="0.35"/>
    <text x="655" y="395" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Dividend yield</text>
    <text x="655" y="448" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">11,2%</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="910" y="350" width="220" height="130" rx="18" fill="#0B1220" opacity="0.92" stroke="#6EE4EF" stroke-opacity="0.35"/>
    <text x="935" y="395" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Carteira</text>
    <text x="935" y="448" fill="#6EE4EF" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">3 ações</text>
  </g>

  <path d="M90 545 C240 505, 355 575, 505 532 S780 515, 930 560 S1080 530, 1130 545" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <text x="70" y="592" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="20">Resposta curta: barato no preço, mas a tese depende de qualidade do crédito e lucro recorrente.</text>
</svg>
