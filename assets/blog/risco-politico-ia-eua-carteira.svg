<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Risco político, IA nos EUA e carteira defensiva</title>
  <desc id="desc">Diagrama IA em Loop conectando risco político brasileiro, juros, dólar, IA nos EUA, concentração do S&amp;P 500 e disciplina de carteira.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset="0.52" stop-color="#101d2b"/>
      <stop offset="1" stop-color="#2a2114"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d56f"/>
      <stop offset="1" stop-color="#aa8451"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee4ef"/>
      <stop offset="1" stop-color="#2aa7c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <g opacity="0.13">
    <circle cx="1040" cy="82" r="170" fill="#6ee4ef"/>
    <circle cx="170" cy="430" r="190" fill="#f6d56f"/>
    <path d="M0 120 C230 40 360 180 590 110 C790 48 930 170 1200 88" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M0 412 C230 340 410 450 640 370 C820 308 1020 420 1200 340" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="60" y="74" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#e4d17f">IA em Loop • leitura macro de carteira</text>
  <text x="60" y="126" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Risco político no Brasil + IA nos EUA</text>
  <text x="60" y="164" font-family="Inter, Arial, sans-serif" font-size="22" fill="#cbd5e1">Quando duas narrativas sobem ao mesmo tempo, a carteira precisa de margem de segurança.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="220" width="315" height="205" rx="22" fill="rgba(6,8,13,0.68)" stroke="#aa8451" stroke-opacity="0.55"/>
    <text x="88" y="262" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="url(#gold)">Brasil</text>
    <text x="88" y="303" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e2e8f0">• eleição mais ruidosa</text>
    <text x="88" y="334" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e2e8f0">• risco fiscal e Selic alta</text>
    <text x="88" y="365" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e2e8f0">• dólar e bolsa sensíveis</text>
    <text x="88" y="396" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e2e8f0">• prêmio para caixa e qualidade</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="442" y="220" width="315" height="205" rx="22" fill="rgba(6,8,13,0.68)" stroke="#6ee4ef" stroke-opacity="0.55"/>
    <text x="470" y="262" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="url(#cyan)">EUA / IA</text>
    <text x="470" y="303" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e2e8f0">• data centers puxam crescimento</text>
    <text x="470" y="334" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e2e8f0">• S&amp;P 500 concentrado</text>
    <text x="470" y="365" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e2e8f0">• capex alto e fluxo de caixa</text>
    <text x="470" y="396" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e2e8f0">• correção pode vir sem aviso</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="824" y="220" width="315" height="205" rx="22" fill="rgba(6,8,13,0.68)" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="852" y="262" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Carteira</text>
    <text x="852" y="303" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e2e8f0">• ranking filtra, não decide</text>
    <text x="852" y="334" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e2e8f0">• evitar narrativa concentrada</text>
    <text x="852" y="365" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e2e8f0">• caixa, ROIC e preço</text>
    <text x="852" y="396" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e2e8f0">• comprar só com margem</text>
  </g>

  <path d="M382 322 L430 322" stroke="#e4d17f" stroke-width="4" stroke-linecap="round"/>
  <path d="M764 322 L812 322" stroke="#6ee4ef" stroke-width="4" stroke-linecap="round"/>
  <circle cx="406" cy="322" r="6" fill="#e4d17f"/>
  <circle cx="788" cy="322" r="6" fill="#6ee4ef"/>
</svg>
