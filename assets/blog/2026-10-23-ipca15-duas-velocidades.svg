<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">IPCA-15: duas velocidades em outubro de 2026</title>
<desc id="desc">A variação mensal recuou de 0,70% em setembro para 0,32% em outubro, mas o acumulado em 12 meses subiu de 4,47% para 4,62%. Alimentação e bebidas variou 0,88% e contribuiu 0,19 ponto percentual para o índice de outubro. Fonte IBGE, divulgação de 23 de outubro de 2026.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061423"/><stop offset="1" stop-color="#121a28"/></linearGradient><linearGradient id="monthly" x1="0" x2="1"><stop stop-color="#77e1e8"/><stop offset="1" stop-color="#bdf297"/></linearGradient><linearGradient id="annual" x1="0" x2="1"><stop stop-color="#eed67f"/><stop offset="1" stop-color="#f4a579"/></linearGradient></defs>
<rect width="1200" height="660" rx="30" fill="url(#bg)"/><rect x="32" y="32" width="1136" height="596" rx="26" fill="none" stroke="#47687b" opacity=".35"/>
<text x="74" y="93" fill="#75dfe5" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">IA EM LOOP / DADOS DO IBGE</text>
<text x="74" y="147" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="39" font-weight="800">IPCA-15 em duas velocidades</text><text x="74" y="188" fill="#b5c6d1" font-family="Inter,Arial,sans-serif" font-size="23">Outubro de 2026 · prévia da inflação</text>
<rect x="74" y="226" width="500" height="258" rx="22" fill="#142b37" stroke="#365a62"/><text x="108" y="274" fill="#a7ccd2" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">VARIAÇÃO NO MÊS</text><text x="108" y="333" fill="#c0d2d7" font-family="Inter,Arial,sans-serif" font-size="22">Setembro</text><text x="353" y="333" fill="#d8e4e7" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="600">0,70%</text><text x="108" y="406" fill="#dff8de" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">Outubro</text><text x="342" y="419" fill="url(#monthly)" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="800">0,32%</text><text x="108" y="454" fill="#85e6be" font-family="Inter,Arial,sans-serif" font-size="18">↓ 0,38 ponto percentual no mês</text>
<rect x="626" y="226" width="500" height="258" rx="22" fill="#302b29" stroke="#6d5b48"/><text x="660" y="274" fill="#d5c2ad" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">ACUMULADO EM 12 MESES</text><text x="660" y="333" fill="#decfc3" font-family="Inter,Arial,sans-serif" font-size="22">Setembro</text><text x="902" y="333" fill="#ebded0" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="600">4,47%</text><text x="660" y="406" fill="#fff1ce" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">Outubro</text><text x="895" y="419" fill="url(#annual)" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="800">4,62%</text><text x="660" y="454" fill="#f4cf96" font-family="Inter,Arial,sans-serif" font-size="18">↑ 0,15 ponto percentual em 12 meses</text>
<rect x="74" y="507" width="1052" height="77" rx="17" fill="#102235" stroke="#355574"/><text x="104" y="542" fill="#f1e3ba" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">Alimentação e bebidas: +0,88%</text><text x="104" y="568" fill="#b9c8d5" font-family="Inter,Arial,sans-serif" font-size="18">Impacto de 0,19 p.p. no índice de outubro (0,32%).</text>
<text x="74" y="611" fill="#8399a7" font-family="Inter,Arial,sans-serif" font-size="16">Fonte: IBGE / SIDRA 7062 · divulgação em 23/10/2026 · IPCA-15 não é o IPCA fechado.</text>
</svg>
