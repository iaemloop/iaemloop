<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MILS3, locação de equipamentos e IA operacional</title>
  <desc id="desc">Diagrama escuro mostrando Mills, locação de equipamentos, margem, dividendos, ranking Magic Formula e IA operacional.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06080D"/>
      <stop offset="0.55" stop-color="#101B27"/>
      <stop offset="1" stop-color="#19364D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#E4D17F"/>
      <stop offset="1" stop-color="#AA8451"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="110" r="170" fill="#6EE4EF" opacity="0.08"/>
  <circle cx="135" cy="540" r="210" fill="#E4D17F" opacity="0.07"/>
  <text x="72" y="92" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#E4D17F">IA em Loop • Leitura diária • 23/05/2026</text>
  <text x="72" y="165" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800" fill="#FFFFFF">MILS3</text>
  <text x="72" y="222" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#6EE4EF">locação, margem e IA operacional</text>
  <text x="72" y="272" font-family="Inter, Arial, sans-serif" font-size="24" fill="#CBD5E1">Máquinas e plataformas dependem de utilização, preço e disciplina.</text>
  <text x="72" y="307" font-family="Inter, Arial, sans-serif" font-size="24" fill="#CBD5E1">A tecnologia só ajuda se reduzir ociosidade e elevar retorno.</text>

  <g transform="translate(72 360)">
    <rect width="300" height="118" rx="18" fill="#0B1220" opacity="0.78" stroke="#E4D17F" stroke-opacity="0.35"/>
    <text x="24" y="40" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94A3B8" font-weight="700">Magic Formula</text>
    <text x="24" y="84" font-family="Inter, Arial, sans-serif" font-size="34" fill="#E4D17F" font-weight="800">29º • score 77</text>
  </g>
  <g transform="translate(408 360)">
    <rect width="300" height="118" rx="18" fill="#0B1220" opacity="0.78" stroke="#6EE4EF" stroke-opacity="0.28"/>
    <text x="24" y="40" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94A3B8" font-weight="700">Fundamentus</text>
    <text x="24" y="84" font-family="Inter, Arial, sans-serif" font-size="34" fill="#6EE4EF" font-weight="800">ROIC 20,6%</text>
  </g>
  <g transform="translate(744 360)">
    <rect width="300" height="118" rx="18" fill="#0B1220" opacity="0.78" stroke="#E4D17F" stroke-opacity="0.35"/>
    <text x="24" y="40" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94A3B8" font-weight="700">Leitura de risco</text>
    <text x="24" y="84" font-family="Inter, Arial, sans-serif" font-size="34" fill="#E4D17F" font-weight="800">ciclo + execução</text>
  </g>

  <g transform="translate(790 110)" filter="url(#glow)">
    <rect x="0" y="210" width="230" height="38" rx="10" fill="url(#gold)"/>
    <rect x="38" y="122" width="96" height="88" rx="10" fill="#19364D" stroke="#6EE4EF" stroke-width="4"/>
    <rect x="150" y="72" width="64" height="138" rx="10" fill="#19364D" stroke="#E4D17F" stroke-width="4"/>
    <circle cx="58" cy="265" r="34" fill="#0B1220" stroke="#6EE4EF" stroke-width="6"/>
    <circle cx="182" cy="265" r="34" fill="#0B1220" stroke="#E4D17F" stroke-width="6"/>
    <path d="M214 72 L270 28 L292 50 L238 94 Z" fill="#AA8451" opacity="0.95"/>
    <path d="M214 72 L250 105" stroke="#E4D17F" stroke-width="10" stroke-linecap="round"/>
