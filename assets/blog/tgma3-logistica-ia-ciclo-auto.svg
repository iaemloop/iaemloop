<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">TGMA3, logística automotiva, Magic Formula e IA operacional</title>
  <desc id="desc">Mapa visual da tese de TGMA3: ranking Magic Formula, carteira real, ciclo automotivo, eficiência logística e riscos de volume.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06080D"/>
      <stop offset="0.55" stop-color="#102537"/>
      <stop offset="1" stop-color="#1b1408"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#E4D17F"/>
      <stop offset="1" stop-color="#AA8451"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .label{font:700 30px Inter,Arial,sans-serif;fill:#fff}.small{font:600 18px Inter,Arial,sans-serif;fill:#cbd5e1}.tiny{font:600 14px Inter,Arial,sans-serif;fill:#94a3b8}.num{font:800 34px Inter,Arial,sans-serif;fill:#E4D17F}.card{fill:rgba(6,8,13,.55);stroke:rgba(228,209,127,.35);stroke-width:2}.line{stroke:#6EE4EF;stroke-width:4;stroke-linecap:round;opacity:.85}.risk{fill:#ef4444}.ok{fill:#10b981}.warn{fill:#E4D17F}
    </style>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)"/>
  <circle cx="980" cy="90" r="130" fill="#6EE4EF" opacity=".09" filter="url(#glow)"/>
  <circle cx="170" cy="585" r="155" fill="#E4D17F" opacity=".08" filter="url(#glow)"/>
  <text x="62" y="78" class="label">TGMA3: logística barata ou ciclo no pico?</text>
  <text x="62" y="113" class="small">Ranking Magic Formula • carteira real • veículos • eficiência com IA</text>

  <g transform="translate(62 160)">
    <rect class="card" rx="20" width="315" height="160"/>
    <text x="26" y="48" class="tiny">Magic Formula de maio</text>
    <text x="26" y="92" class="num">14º lugar</text>
    <text x="26" y="126" class="small">ROIC 32,0% • EY 13,7%</text>
  </g>
  <g transform="translate(442 160)">
    <rect class="card" rx="20" width="315" height="160"/>
    <text x="26" y="48" class="tiny">Carteira real</text>
    <text x="26" y="92" class="num">2 ações</text>
    <text x="26" y="126" class="small">R$ 39,40 de custo médio</text>
  </g>
  <g transform="translate(822 160)">
    <rect class="card" rx="20" width="315" height="160"/>
    <text x="26" y="48" class="tiny">Fundamentus em 20/05</text>
    <text x="26" y="92" class="num">P/L 8,49</text>
    <text x="26" y="126" class="small">ROIC 27,2% • EV/EBIT 6,69</text>
  </g>

  <path class="line" d="M205 388 C295 350, 378 350, 464 390 S630 434, 715 390 S870 330, 994 388" fill="none"/>
  <circle cx="205" cy="388" r="13" class="ok"/><circle cx="464" cy="390" r="13" class="warn"/><circle cx="715" cy="390" r="13" class="warn"/><circle cx="994" cy="388" r="13" class="risk"/>
  <text x="118" y="442" class="small">volume de veículos</text>
  <text x="394" y="442" class="small">margem operacional</text>
  <text x="646" y="442" class="small">automação de rotas</text>
  <text x="910" y="442" class="small">juros e ciclo</text>

  <g transform="translate(118 500)">
    <rect class="card" rx="16" width="965" height="112"/>
    <text x="30" y="42" class="small">Leitura IA em Loop</text>
    <text x="30" y="78" class="label" font-size="24">Manter e monitorar: boa qualidade operacional, mas reforço depende de volume, caixa e ciclo automotivo.</text>
  </g>
</svg>
