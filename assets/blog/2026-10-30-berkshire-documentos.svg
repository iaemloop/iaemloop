<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Berkshire: três documentos, três estados</title><desc id="desc">Colocação privada concluída; dívida precificada e ainda sujeita a liquidação; venda parcial de DaVita reportada.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08131e"/><stop offset="1" stop-color="#19364d"/></linearGradient></defs><rect width="1200" height="620" fill="url(#bg)"/><text x="65" y="92" fill="#6ee4ef" font-family="Arial,sans-serif" font-size="34" font-weight="bold">BERKSHIRE · LEITURA DOCUMENTAL</text><text x="65" y="142" fill="#f3f6f8" font-family="Arial,sans-serif" font-size="43" font-weight="bold">O verbo muda a conclusão</text><g font-family="Arial,sans-serif"><rect x="58" y="202" width="345" height="274" rx="20" fill="#142b3a" stroke="#6ee4ef" stroke-width="3"/><text x="83" y="259" fill="#6ee4ef" font-size="22">29 OUT · EQUITY</text><text x="83" y="317" fill="white" font-size="30" font-weight="bold">CONCLUÍDO</text><text x="83" y="365" fill="#d9e7ed" font-size="21">US$ 330 mi brutos</text><text x="83" y="397" fill="#d9e7ed" font-size="21">participação ordinária</text><rect x="427" y="202" width="345" height="274" rx="20" fill="#142b3a" stroke="#e4d17f" stroke-width="3"/><text x="452" y="259" fill="#e4d17f" font-size="22">28 OUT · DÍVIDA</text><text x="452" y="317" fill="white" font-size="30" font-weight="bold">PRECIFICADA</text><text x="452" y="365" fill="#d9e7ed" font-size="21">~US$ 1,8 bi equivalentes</text><text x="452" y="397" fill="#d9e7ed" font-size="21">liquidação ainda pendente</text><rect x="796" y="202" width="345" height="274" rx="20" fill="#142b3a" stroke="#a4b6c0" stroke-width="3"/><text x="821" y="259" fill="#a4b6c0" font-size="22">27 OUT · DAVITA</text><text x="821" y="317" fill="white" font-size="30" font-weight="bold">VENDA PARCIAL</text><text x="821" y="365" fill="#d9e7ed" font-size="21">posição parcialmente reduzida</text><text x="821" y="397" fill="#d9e7ed" font-size="21">saldo remanescente</text><text x="65" y="548" fill="#d9e7ed" font-size="23">Aporte ≠ retorno  ·  Precificação ≠ liquidação  ·  Venda parcial ≠ saída integral</text></g></svg>
