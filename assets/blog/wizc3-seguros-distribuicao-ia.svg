<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">WIZC3, seguros, distribuição financeira e IA</title>
  <desc id="desc">Diagrama visual em estilo IA em Loop mostrando WIZC3 no centro de ranking, dividendos, parcerias, juros e IA operacional.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080d"/>
      <stop offset="0.55" stop-color="#101d2b"/>
      <stop offset="1" stop-color="#19364D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4D17F"/>
      <stop offset="1" stop-color="#AA8451"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="985" cy="110" r="220" fill="#6EE4EF" opacity="0.08"/>
  <circle cx="130" cy="520" r="260" fill="#E4D17F" opacity="0.08"/>
  <text x="70" y="82" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">IA em Loop • Leitura diária • 14/05/2026</text>
  <text x="70" y="150" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">WIZC3 no radar</text>
  <text x="70" y="205" fill="#6EE4EF" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">seguros, dividendos e IA operacional</text>
  <text x="72" y="252" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="22">Ranking é filtro: qualidade + preço + auditoria de parcerias</text>

  <g filter="url(#shadow)">
    <rect x="70" y="310" width="250" height="125" rx="18" fill="#0b1220" stroke="#E4D17F" stroke-opacity="0.35"/>
    <text x="96" y="354" fill="#94a3b8" font-family="Inter, Arial" font-size="18" font-weight="700">Magic Formula</text>
    <text x="96" y="398" fill="#E4D17F" font-family="Inter, Arial" font-size="46" font-weight="800">#2</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="355" y="310" width="250" height="125" rx="18" fill="#0b1220" stroke="#6EE4EF" stroke-opacity="0.28"/>
    <text x="381" y="354" fill="#94a3b8" font-family="Inter, Arial" font-size="18" font-weight="700">ROIC</text>
    <text x="381" y="398" fill="#6EE4EF" font-family="Inter, Arial" font-size="46" font-weight="800">35,46%</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="640" y="310" width="250" height="125" rx="18" fill="#0b1220" stroke="#E4D17F" stroke-opacity="0.35"/>
    <text x="666" y="354" fill="#94a3b8" font-family="Inter, Arial" font-size="18" font-weight="700">Dividend yield</text>
    <text x="666" y="398" fill="#E4D17F" font-family="Inter, Arial" font-size="46" font-weight="800">8,0%</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="925" y="310" width="205" height="125" rx="18" fill="#0b1220" stroke="#6EE4EF" stroke-opacity="0.28"/>
    <text x="951" y="354" fill="#94a3b8" font-family="Inter, Arial" font-size="18" font-weight="700">Risco-chave</text>
    <text x="951" y="394" fill="#ffffff" font-family="Inter, Arial" font-size="30" font-weight="800">canais</text>
  </g>

  <path d="M175 505 C 330 455, 445 548, 590 500 S 845 452, 1035 498" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <circle cx="175" cy="505" r="10" fill="#E4D17F"/><circle cx="590" cy="500" r="10" fill="#6EE4EF"/><circle cx="1035" cy="498" r="10" fill="#E4D17F"/>
  <text x="70" y="580" fill="#94a3b8" font-family="Inter, Arial" font-size="18">Compra com validação: lucro recorrente, contratos, caixa e governança antes de qualquer decisão.</text>
