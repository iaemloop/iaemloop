<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Choque de mercado e cenários para o Brasil</title><desc id="desc">Circuit breaker no dia 26 de outubro, canais econômicos e dois cenários condicionais</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06101c"/><stop offset="1" stop-color="#19364d"/></linearGradient><linearGradient id="gold" x2="1"><stop stop-color="#6ee4ef"/><stop offset="1" stop-color="#e4d17f"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><g fill="none" stroke="#6ee4ef" opacity=".16"><path d="M0 130h1200M0 340h1200M0 540h1200M140 0v630M600 0v630M1020 0v630"/></g><text x="76" y="94" font-family="Arial,sans-serif" font-weight="700" font-size="26" fill="#6ee4ef">IA EM LOOP  ·  ANÁLISE DE CENÁRIOS</text><text x="76" y="174" font-family="Arial,sans-serif" font-weight="700" font-size="53" fill="#f1f5f9">Circuit breaker, câmbio</text><text x="76" y="232" font-family="Arial,sans-serif" font-weight="700" font-size="53" fill="#f1f5f9">e instituições</text><text x="76" y="294" font-family="Arial,sans-serif" font-size="24" fill="#b6c9d9">O choque de 26/10 não define sozinho os próximos anos.</text><rect x="76" y="342" width="291" height="123" rx="18" fill="#183447" stroke="#6ee4ef"/><text x="95" y="383" font-family="Arial,sans-serif" font-size="20" fill="#b6c9d9">FATO · 26/10</text><text x="95" y="425" font-family="Arial,sans-serif" font-weight="700" font-size="28" fill="#f1f5f9">−13,88% no Ibovespa</text><text x="388" y="415" font-family="Arial,sans-serif" font-size="39" fill="#e4d17f">→</text><rect x="451" y="342" width="290" height="123" rx="18" fill="#183447" stroke="#e4d17f"/><text x="472" y="383" font-family="Arial,sans-serif" font-size="20" fill="#b6c9d9">TRANSMISSÃO</text><text x="472" y="425" font-family="Arial,sans-serif" font-weight="700" font-size="28" fill="#f1f5f9">Juros · dólar · caixa</text><text x="760" y="415" font-family="Arial,sans-serif" font-size="39" fill="#e4d17f">→</text><rect x="826" y="342" width="300" height="123" rx="18" fill="#183447" stroke="#6ee4ef"/><text x="847" y="383" font-family="Arial,sans-serif" font-size="20" fill="#b6c9d9">HIPÓTESES</text><text x="847" y="425" font-family="Arial,sans-serif" font-weight="700" font-size="26" fill="#f1f5f9">A · continuidade</text><text x="847" y="454" font-family="Arial,sans-serif" font-weight="700" font-size="26" fill="#f1f5f9">B · eventual processo</text><rect x="76" y="510" width="1048" height="3" fill="url(#gold)"/><text x="76" y="556" font-family="Arial,sans-serif" font-size="23" fill="#b6c9d9">Dados de fechamento ≠ cotações intradiárias ≠ previsões políticas.</text><text x="76" y="595" font-family="Arial,sans-serif" font-size="18" fill="#b6c9d9">28 OUT 2026  ·  Conteúdo educacional</text></svg>