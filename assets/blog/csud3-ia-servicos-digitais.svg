  <text x="74" y="220" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">serviços digitais, IA e margem</text>
  <text x="74" y="268" font-family="Inter, Arial, sans-serif" font-size="24" fill="#cbd5e1">A pergunta: tecnologia barata ou empresa que precisa provar escala?</text>
