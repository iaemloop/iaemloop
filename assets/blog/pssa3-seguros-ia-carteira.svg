<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PSSA3, seguros, IA e carteira</title>
  <desc id="desc">Diagrama escuro IA em Loop mostrando Porto Seguro entre ranking, carteira real, underwriting, sinistralidade e disciplina de preço.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#050813"/>
      <stop offset="0.55" stop-color="#102334"/>
      <stop offset="1" stop-color="#2a1d12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#6EE4EF"/>
      <stop offset="1" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="100" r="220" fill="#6EE4EF" opacity="0.08"/>
  <circle cx="130" cy="560" r="260" fill="#E4D17F" opacity="0.08"/>
  <text x="70" y="72" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">IA em Loop • Leitura diária • 21/05/2026</text>
  <text x="70" y="145" fill="url(#gold)" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">PSSA3</text>
  <text x="70" y="205" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">seguro bom não é só prêmio barato</text>
  <text x="70" y="252" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="25">Porto Seguro combina ranking forte, carteira real e teste de execução:</text>
  <text x="70" y="286" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="25">sinistralidade, juros, diversificação e IA aplicada ao risco.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="350" width="245" height="150" rx="18" fill="#0b1220" stroke="#E4D17F" stroke-opacity="0.35"/>
    <text x="98" y="395" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Ranking</text>
    <text x="98" y="435" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">1º</text>
    <text x="98" y="470" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="19">Magic Formula de maio</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="352" y="350" width="245" height="150" rx="18" fill="#0b1220" stroke="#6EE4EF" stroke-opacity="0.35"/>
    <text x="378" y="395" fill="#6EE4EF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Qualidade</text>
    <text x="378" y="435" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">ROIC 77%</text>
    <text x="378" y="470" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="19">alto retorno, mas exige validação</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="632" y="350" width="245" height="150" rx="18" fill="#0b1220" stroke="#E4D17F" stroke-opacity="0.35"/>
    <text x="658" y="395" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Carteiras reais</text>
    <text x="658" y="435" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">2x exposta</text>
    <text x="658" y="470" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="19">BESST &amp; Buffett e Magic Formula</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="912" y="350" width="220" height="150" rx="18" fill="#0b1220" stroke="#6EE4EF" stroke-opacity="0.35"/>
    <text x="938" y="395" fill="#6EE4EF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Gatilho</text>
    <text x="938" y="435" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Sinistro</text>
    <text x="938" y="470" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="19">margem antes de euforia</text>
  </g>
  <path d="M160 540 C310 585, 500 585, 660 540 S965 495, 1070 540" fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.85"/>
  <text x="70" y="590" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="20">Não é recomendação personalizada • Estudo educacional com skin in the game</text>
</svg>
