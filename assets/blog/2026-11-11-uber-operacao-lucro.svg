<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Uber: operação sobe, lucro líquido cai</title><desc id="desc">Comparação entre o lucro operacional e o lucro líquido atribuível do terceiro trimestre de 2025 e 2026 em bilhões de dólares.</desc><rect width="1200" height="630" fill="#07121b"/><rect x="36" y="34" width="1128" height="562" rx="26" fill="#112533" stroke="#3a6071"/><text x="82" y="105" fill="#75e7e2" font-family="Arial,sans-serif" font-size="24" font-weight="bold">IA EM LOOP  /  STOCKS EUA</text><text x="82" y="162" fill="#f5f3dc" font-family="Arial,sans-serif" font-size="41" font-weight="bold">Uber: duas histórias no mesmo trimestre</text><text x="82" y="203" fill="#b3c8d3" font-family="Arial,sans-serif" font-size="22">3T25 → 3T26 · valores em US$ bilhões</text><text x="82" y="275" fill="#e1eaf0" font-family="Arial,sans-serif" font-size="27">Lucro operacional</text><rect x="410" y="247" width="160" height="35" rx="8" fill="#547488"/><rect x="410" y="292" width="208" height="35" rx="8" fill="#79ded1"/><text x="635" y="273" fill="#e1eaf0" font-family="Arial,sans-serif" font-size="24">2025  1,113</text><text x="635" y="319" fill="#b9f5e5" font-family="Arial,sans-serif" font-size="24">2026  1,447  ↑</text><text x="82" y="411" fill="#e1eaf0" font-family="Arial,sans-serif" font-size="27">Lucro líquido atribuível</text><rect x="410" y="383" width="490" height="35" rx="8" fill="#547488"/><rect x="410" y="428" width="38" height="35" rx="8" fill="#e8c57e"/><text x="913" y="409" fill="#e1eaf0" font-family="Arial,sans-serif" font-size="24">2025  6,626</text><text x="466" y="455" fill="#f1d39c" font-family="Arial,sans-serif" font-size="24">2026  0,512  ↓</text><text x="82" y="529" fill="#b3c8d3" font-family="Arial,sans-serif" font-size="20">Comparações afetadas por imposto e outros resultados. Fonte: Uber, Form 10-Q (04/11/2026).</text></svg>
