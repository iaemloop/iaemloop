<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">WIZC3: corretagem de seguros, capital leve e dependência de parcerias</title>
  <desc id="desc">Visual IA em Loop mostrando WIZC3 como tese de Magic Formula: ROIC alto, dividendos, caixa líquido e risco de dependência de canais bancários.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06080D"/>
      <stop offset="48%" stop-color="#102238"/>
      <stop offset="100%" stop-color="#2a2114"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6EE4EF"/>
      <stop offset="100%" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="220" fill="#E4D17F" opacity="0.06"/>
  <circle cx="160" cy="600" r="260" fill="#6EE4EF" opacity="0.05"/>
  <text x="70" y="86" fill="#E4D17F" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">IA em Loop • Magic Formula</text>
  <text x="70" y="150" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="800">WIZC3</text>
  <text x="70" y="203" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="600">corretagem de seguros com capital leve</text>

  <g filter="url(#shadow)">
    <rect x="70" y="260" width="310" height="150" rx="20" fill="rgba(19,29,39,0.82)" stroke="#E4D17F" stroke-opacity="0.28"/>
    <text x="100" y="310" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Ranking</text>
    <text x="100" y="358" fill="#E4D17F" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="800">#2</text>
    <text x="100" y="392" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="20">Magic Formula Jun/26</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="445" y="260" width="310" height="150" rx="20" fill="rgba(19,29,39,0.82)" stroke="#6EE4EF" stroke-opacity="0.24"/>
    <text x="475" y="310" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Qualidade</text>
    <text x="475" y="358" fill="#6EE4EF" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="800">ROIC 35%</text>
    <text x="475" y="392" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="20">negócio pouco intensivo em capital</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="820" y="260" width="310" height="150" rx="20" fill="rgba(19,29,39,0.82)" stroke="#E4D17F" stroke-opacity="0.28"/>
    <text x="850" y="310" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Preço e caixa</text>
    <text x="850" y="358" fill="#E4D17F" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="800">P/L 6,3</text>
    <text x="850" y="392" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="20">DY 8,2% • dívida líquida negativa</text>
  </g>

  <path d="M170 505 C300 435, 420 560, 565 495 S830 445, 1018 512" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <circle cx="170" cy="505" r="12" fill="#E4D17F"/>
  <circle cx="565" cy="495" r="12" fill="#6EE4EF"/>
  <circle cx="1018" cy="512" r="12" fill="#E4D17F"/>
  <text x="70" y="585" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600">Tese: retorno alto sobre capital + valuation baixo</text>
  <text x="70" y="625" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="22">Risco: dependência de parcerias e bancos para originar seguros</text>
</svg>
