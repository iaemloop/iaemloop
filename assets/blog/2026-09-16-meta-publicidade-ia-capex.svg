      <stop offset="0" stop-color="#06101a"/>
      <stop offset="0.55" stop-color="#102338"/>
      <stop offset="1" stop-color="#2a1d10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE4EF"/>
      <stop offset="1" stop-color="#E4D17F"/>
