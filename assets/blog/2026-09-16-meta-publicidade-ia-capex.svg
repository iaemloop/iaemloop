  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="80" r="260" fill="#6EE4EF" opacity="0.08"/>
  <circle cx="150" cy="560" r="260" fill="#E4D17F" opacity="0.08"/>
