<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">BMGB4: banco barato, lucro em alta e proventos sob teste</title>
  <desc id="desc">Diagrama em fundo escuro com indicadores de BMGB4: P/L, P/VP, ROE, rendimento em dividendos e presença na carteira real BESST.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.52" stop-color="#0d1f2b"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6EE4EF"/>
      <stop offset="1" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1010" cy="80" r="190" fill="#E4D17F" opacity="0.07"/>
  <circle cx="180" cy="630" r="250" fill="#6EE4EF" opacity="0.06"/>
  <path d="M60 520 C220 430 330 550 470 450 C640 328 760 410 900 295 C1010 205 1090 245 1150 185" fill="none" stroke="#6EE4EF" stroke-width="5" opacity="0.32"/>
  <path d="M60 565 C220 500 350 590 500 500 C660 405 780 465 930 350 C1040 265 1110 320 1150 275" fill="none" stroke="#E4D17F" stroke-width="4" opacity="0.25"/>

  <g filter="url(#shadow)">
    <rect x="70" y="70" width="1060" height="535" rx="28" fill="#101c28" opacity="0.88" stroke="#E4D17F" stroke-opacity="0.25"/>
  </g>

  <text x="110" y="135" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">IA em Loop • leitura diária • 20/07/2026</text>
  <text x="110" y="205" fill="url(#gold)" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="800">BMGB4</text>
  <text x="110" y="260" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="43" font-weight="800">banco barato ou risco escondido?</text>
  <text x="110" y="305" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="25">BMG aparece no Top 2 BESST, com P/VP abaixo de 1,</text>
  <text x="110" y="338" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="25">lucro recente em alta e posição real pequena na carteira.</text>

  <g font-family="Inter, Arial, sans-serif" font-weight="800">
    <rect x="110" y="390" width="185" height="118" rx="18" fill="#07111d" stroke="#6EE4EF" stroke-opacity="0.25"/>
    <text x="132" y="428" fill="#94a3b8" font-size="20">P/L</text>
    <text x="132" y="474" fill="#E4D17F" font-size="39">5,61</text>
    <rect x="315" y="390" width="185" height="118" rx="18" fill="#07111d" stroke="#6EE4EF" stroke-opacity="0.25"/>
    <text x="337" y="428" fill="#94a3b8" font-size="20">P/VP</text>
    <text x="337" y="474" fill="#E4D17F" font-size="39">0,78</text>
    <rect x="520" y="390" width="185" height="118" rx="18" fill="#07111d" stroke="#6EE4EF" stroke-opacity="0.25"/>
    <text x="542" y="428" fill="#94a3b8" font-size="20">ROE</text>
    <text x="542" y="474" fill="#E4D17F" font-size="39">14,0%</text>
    <rect x="725" y="390" width="185" height="118" rx="18" fill="#07111d" stroke="#6EE4EF" stroke-opacity="0.25"/>
    <text x="747" y="428" fill="#94a3b8" font-size="20">Dividendos</text>
    <text x="747" y="474" fill="#E4D17F" font-size="39">9,6%</text>
    <rect x="930" y="390" width="150" height="118" rx="18" fill="#07111d" stroke="#6EE4EF" stroke-opacity="0.25"/>
    <text x="952" y="428" fill="#94a3b8" font-size="20">BESST</text>
    <text x="952" y="474" fill="#E4D17F" font-size="39">#2</text>
  </g>

  <text x="110" y="565" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22">Pergunta respondida: desconto é oportunidade apenas se rentabilidade e crédito continuarem controlados.</text>
</svg>
