<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Microsoft: crescimento e investimento no 1T fiscal de 2027</title><desc id="desc">Microsoft Cloud: receita US$ 63,9 bilhões e crescimento anual de 30%. Caixa operacional: US$ 58,0 bilhões. Adições de imobilizado pagas: US$ 39,4 bilhões.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08131e"/><stop offset="1" stop-color="#19364d"/></linearGradient></defs><rect width="1200" height="620" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="65" y="89" fill="#6ee4ef" font-size="30" font-weight="bold">MICROSOFT · 1T FISCAL 2027</text><text x="65" y="150" fill="#fff" font-size="44" font-weight="bold">Demanda cresce. Infraestrutura custa.</text><rect x="60" y="206" width="340" height="268" rx="18" fill="#142b3a" stroke="#6ee4ef" stroke-width="3"/><text x="86" y="255" fill="#6ee4ef" font-size="22">RECEITA DE NUVEM</text><text x="86" y="322" fill="#fff" font-size="48" font-weight="bold">US$ 63,9 bi</text><text x="86" y="372" fill="#cfe5ec" font-size="24">+30% em um ano</text><rect x="430" y="206" width="340" height="268" rx="18" fill="#142b3a" stroke="#e4d17f" stroke-width="3"/><text x="456" y="255" fill="#e4d17f" font-size="22">CAIXA OPERACIONAL</text><text x="456" y="322" fill="#fff" font-size="48" font-weight="bold">US$ 58,0 bi</text><text x="456" y="372" fill="#d9e7ed" font-size="22">no trimestre</text><rect x="800" y="206" width="340" height="268" rx="18" fill="#142b3a" stroke="#f0a889" stroke-width="3"/><text x="826" y="255" fill="#f0a889" font-size="21">ADIÇÕES DE IMOBILIZADO</text><text x="826" y="322" fill="#fff" font-size="48" font-weight="bold">US$ 39,4 bi</text><text x="826" y="372" fill="#d9e7ed" font-size="22">pagas em caixa</text><text x="65" y="543" fill="#b9d0d9" font-size="20">Métricas de naturezas distintas · trimestre encerrado em 30/09/2026</text></g></svg>
