<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Alphabet no radar IA em Loop</title>
  <desc id="desc">Painel visual sobre Alphabet: busca, YouTube, nuvem, caixa, ranking e valuation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#06080D"/><stop offset="0.52" stop-color="#102334"/><stop offset="1" stop-color="#19364D"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#6EE4EF"/><stop offset="1" stop-color="#E4D17F"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="95" r="185" fill="#6EE4EF" opacity="0.09"/>
  <circle cx="145" cy="545" r="210" fill="#E4D17F" opacity="0.08"/>
  <g filter="url(#shadow)"><rect x="70" y="70" width="1060" height="490" rx="34" fill="#131D27" opacity="0.88" stroke="#E4D17F" stroke-opacity="0.28"/></g>
  <text x="105" y="138" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">IA em Loop • Stock EUA • Watchlist</text>
  <text x="105" y="215" fill="url(#gold)" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="800">GOOGL: qualidade</text>
  <text x="105" y="288" fill="url(#gold)" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="800">com preço razoável?</text>
  <text x="108" y="344" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="25">Busca, YouTube, nuvem e caixa contra regulação, capex e disputa em IA.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">
    <rect x="105" y="395" width="188" height="80" rx="18" fill="#06080D" opacity="0.72" stroke="#6EE4EF" stroke-opacity="0.28"/>
    <text x="128" y="428" fill="#94A3B8">BESST</text><text x="128" y="461" fill="#E4D17F">#13</text>
    <rect x="315" y="395" width="188" height="80" rx="18" fill="#06080D" opacity="0.72" stroke="#6EE4EF" stroke-opacity="0.28"/>
    <text x="338" y="428" fill="#94A3B8">P/L</text><text x="338" y="461" fill="#E4D17F">18,19</text>
    <rect x="525" y="395" width="188" height="80" rx="18" fill="#06080D" opacity="0.72" stroke="#6EE4EF" stroke-opacity="0.28"/>
    <text x="548" y="428" fill="#94A3B8">ROE</text><text x="548" y="461" fill="#E4D17F">48,68%</text>
    <rect x="735" y="395" width="250" height="80" rx="18" fill="#06080D" opacity="0.72" stroke="#6EE4EF" stroke-opacity="0.28"/>
    <text x="758" y="428" fill="#94A3B8">Preço</text><text x="758" y="461" fill="#E4D17F">US$ 344,90</text>
  </g>
  <text x="105" y="525" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="18">Conteúdo educacional, sem recomendação personalizada.</text>
</svg>
