<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">BRK-B, Berkshire: sucessão, cultura e alocação de capital</title>
  <desc id="desc">Diagrama visual IA em Loop sobre Berkshire Hathaway, sucessão, cultura, compras de Lennar, float de seguros e disciplina de capital.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06080D"/>
      <stop offset="55%" stop-color="#10243A"/>
      <stop offset="100%" stop-color="#19364D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6EE4EF"/>
      <stop offset="100%" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="95" r="190" fill="#6EE4EF" opacity="0.08"/>
  <circle cx="150" cy="560" r="240" fill="#E4D17F" opacity="0.08"/>
  <text x="70" y="86" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">IA em Loop • Stock EUA</text>
  <text x="70" y="148" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800">BRK-B: sucessão</text>
  <text x="70" y="210" fill="url(#gold)" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800">e alocação de capital</text>
  <g filter="url(#shadow)">
    <rect x="70" y="270" width="315" height="205" rx="22" fill="#0B1220" opacity="0.92" stroke="#E4D17F" stroke-opacity="0.25"/>
    <text x="100" y="322" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Cultura</text>
    <text x="100" y="365" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Buffett emeritus</text>
    <text x="100" y="402" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Howard no conselho</text>
    <text x="100" y="439" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Abel no comando</text>
    <rect x="442" y="270" width="315" height="205" rx="22" fill="#0B1220" opacity="0.92" stroke="#6EE4EF" stroke-opacity="0.25"/>
    <text x="472" y="322" fill="#6EE4EF" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Form 4 Lennar</text>
    <text x="472" y="365" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">660.410 ações</text>
    <text x="472" y="408" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">~US$ 53,9 mi</text>
    <text x="472" y="445" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">28–30/09/2026</text>
    <rect x="814" y="270" width="315" height="205" rx="22" fill="#0B1220" opacity="0.92" stroke="#E4D17F" stroke-opacity="0.25"/>
    <text x="844" y="322" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Régua IA em Loop</text>
    <text x="844" y="365" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Watchlist #8</text>
    <text x="844" y="408" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">P/L 12,72</text>
    <text x="844" y="445" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">ROE 12,12%</text>
  </g>
  <path d="M215 510 C400 555, 760 555, 985 510" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <text x="70" y="580" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">A pergunta: a cultura continua aparecendo nas decisões, não só nos comunicados?</text>
</svg>
