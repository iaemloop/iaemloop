<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">AMZN: AWS, IA e disciplina de capital</title>
  <desc id="desc">Diagrama visual sobre Amazon, AWS, inteligência artificial, fluxo de caixa e valuation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06080D"/>
      <stop offset="0.52" stop-color="#12283a"/>
      <stop offset="1" stop-color="#2b1f10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#6EE4EF"/>
      <stop offset="1" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <circle cx="1030" cy="90" r="170" fill="#E4D17F" opacity="0.08"/>
  <circle cx="160" cy="560" r="220" fill="#6EE4EF" opacity="0.08"/>
  <text x="70" y="95" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">IA em Loop • Stock EUA • 28/09/2026</text>
  <text x="70" y="152" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="800">AMZN</text>
  <text x="70" y="208" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600">Amazon: AWS acelera, mas a conta da IA passa pelo caixa</text>

  <g transform="translate(70 265)" filter="url(#shadow)">
    <rect width="310" height="230" rx="22" fill="#0b1220" opacity="0.84" stroke="#E4D17F" stroke-opacity="0.25"/>
    <text x="26" y="48" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Receita 2T26</text>
    <text x="26" y="104" fill="url(#gold)" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">US$ 200,6 bi</text>
    <text x="26" y="150" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="19">+20% ano contra ano</text>
    <rect x="26" y="177" width="245" height="12" rx="6" fill="#19364D"/>
    <rect x="26" y="177" width="196" height="12" rx="6" fill="#6EE4EF"/>
  </g>

  <g transform="translate(445 265)" filter="url(#shadow)">
    <rect width="310" height="230" rx="22" fill="#0b1220" opacity="0.84" stroke="#E4D17F" stroke-opacity="0.25"/>
    <text x="26" y="48" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">AWS</text>
    <text x="26" y="104" fill="url(#gold)" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">+37%</text>
    <text x="26" y="150" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="19">US$ 42,2 bi de vendas</text>
    <text x="26" y="184" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="19">US$ 16,6 bi de lucro operacional</text>
  </g>

  <g transform="translate(820 265)" filter="url(#shadow)">
    <rect width="310" height="230" rx="22" fill="#0b1220" opacity="0.84" stroke="#E4D17F" stroke-opacity="0.25"/>
    <text x="26" y="48" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Risco central</text>
    <text x="26" y="104" fill="url(#gold)" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">FCF -US$ 7,6 bi</text>
    <text x="26" y="150" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="19">capex pesado em IA</text>
    <text x="26" y="184" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="19">demanda precisa virar retorno</text>
  </g>

  <path d="M182 535 C310 585, 470 585, 602 535 S890 485, 1030 535" fill="none" stroke="#E4D17F" stroke-width="5" opacity="0.75"/>
  <text x="70" y="594" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="20">Pergunta do investidor: a nuvem financia a próxima onda de IA ou o capex comprime a geração de caixa?</text>
</svg>
