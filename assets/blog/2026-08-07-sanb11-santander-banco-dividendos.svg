<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SANB11, Santander Brasil e o teste do banco barato</title>
  <desc id="desc">Diagrama IA em Loop conectando ranking Barsi, custódia, dividendos, lucro, patrimônio e risco de crédito em SANB11.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080D"/>
      <stop offset="0.55" stop-color="#132033"/>
      <stop offset="1" stop-color="#3a2817"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE4EF"/>
      <stop offset="1" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="80" r="210" fill="#E4D17F" opacity="0.08"/>
  <circle cx="120" cy="560" r="230" fill="#6EE4EF" opacity="0.08"/>
  <text x="70" y="78" fill="#94a3b8" font-family="Inter, Arial" font-size="24" font-weight="700">IA em Loop • Ação Brasil</text>
  <text x="70" y="144" fill="url(#gold)" font-family="Inter, Arial" font-size="58" font-weight="800">SANB11</text>
  <text x="70" y="200" fill="#ffffff" font-family="Inter, Arial" font-size="40" font-weight="750">banco barato ou risco de crédito?</text>
  <text x="70" y="250" fill="#cbd5e1" font-family="Inter, Arial" font-size="24">Santander Brasil combina escala, dividendos e P/VP baixo; a tese depende de inadimplência, margem financeira e retorno sobre patrimônio.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="310" width="250" height="118" rx="18" fill="#0b1220" stroke="#E4D17F" stroke-opacity="0.28"/>
    <text x="95" y="350" fill="#94a3b8" font-family="Inter, Arial" font-size="18" font-weight="700">Barsi</text>
    <text x="95" y="392" fill="#E4D17F" font-family="Inter, Arial" font-size="36" font-weight="800">#2</text>
    <text x="150" y="392" fill="#cbd5e1" font-family="Inter, Arial" font-size="22">score 70,5</text>
    <rect x="350" y="310" width="250" height="118" rx="18" fill="#0b1220" stroke="#E4D17F" stroke-opacity="0.28"/>
    <text x="375" y="350" fill="#94a3b8" font-family="Inter, Arial" font-size="18" font-weight="700">Valuation</text>
    <text x="375" y="392" fill="#E4D17F" font-family="Inter, Arial" font-size="36" font-weight="800">P/VP 0,82</text>
    <rect x="630" y="310" width="250" height="118" rx="18" fill="#0b1220" stroke="#E4D17F" stroke-opacity="0.28"/>
    <text x="655" y="350" fill="#94a3b8" font-family="Inter, Arial" font-size="18" font-weight="700">Renda</text>
    <text x="655" y="392" fill="#E4D17F" font-family="Inter, Arial" font-size="36" font-weight="800">DY 6,38%</text>
    <rect x="910" y="310" width="220" height="118" rx="18" fill="#0b1220" stroke="#6EE4EF" stroke-opacity="0.25"/>
    <text x="935" y="350" fill="#94a3b8" font-family="Inter, Arial" font-size="18" font-weight="700">Custódia</text>
    <text x="935" y="392" fill="#6EE4EF" font-family="Inter, Arial" font-size="34" font-weight="800">real</text>
  </g>
  <path d="M120 510 C270 455, 360 552, 510 492 S760 445, 870 505 S1010 545, 1100 470" fill="none" stroke="#6EE4EF" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  <path d="M120 530 C270 475, 360 572, 510 512 S760 465, 870 525 S1010 565, 1100 490" fill="none" stroke="#E4D17F" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <text x="70" y="590" fill="#94a3b8" font-family="Inter, Arial" font-size="18">Fonte: rankings IA em Loop, carteira real e dados CVM consultados em 07/08/2026.</text>
</svg>
