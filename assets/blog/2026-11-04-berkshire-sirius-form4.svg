<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Berkshire e Sirius XM: três camadas de leitura</title><desc id="desc">Diagrama educacional: registro regulatório, resultados da empresa e avaliação crítica. Não é recomendação.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08131e"/><stop offset="1" stop-color="#19364d"/></linearGradient></defs><rect width="1200" height="620" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="65" y="88" fill="#6ee4ef" font-size="29" font-weight="bold">BERKSHIRE · SIRIUS XM · FORM 4</text><text x="65" y="150" fill="#fff" font-size="43" font-weight="bold">Compra registrada ≠ tese concluída</text><rect x="60" y="204" width="338" height="245" rx="18" fill="#142b3a" stroke="#6ee4ef" stroke-width="3"/><text x="86" y="260" fill="#6ee4ef" font-size="23">REGISTRO</text><text x="86" y="324" fill="#fff" font-size="31" font-weight="bold">O que ocorreu?</text><text x="86" y="374" fill="#d9e7ed" font-size="21">Datas e declarações</text><rect x="430" y="204" width="338" height="245" rx="18" fill="#142b3a" stroke="#e4d17f" stroke-width="3"/><text x="456" y="260" fill="#e4d17f" font-size="23">NEGÓCIO</text><text x="456" y="324" fill="#fff" font-size="31" font-weight="bold">Como opera?</text><text x="456" y="374" fill="#d9e7ed" font-size="21">Receita, caixa e dívida</text><rect x="800" y="204" width="340" height="245" rx="18" fill="#142b3a" stroke="#f0a889" stroke-width="3"/><text x="826" y="260" fill="#f0a889" font-size="23">ANÁLISE</text><text x="826" y="324" fill="#fff" font-size="31" font-weight="bold">Qual o risco?</text><text x="826" y="374" fill="#d9e7ed" font-size="21">Cenários e preço</text><text x="65" y="519" fill="#fff" font-size="28" font-weight="bold">Fato documentado não é recomendação.</text><text x="65" y="562" fill="#b9d0d9" font-size="19">Fontes: SEC e Sirius XM · estudo educacional IA em Loop</text></g></svg>
