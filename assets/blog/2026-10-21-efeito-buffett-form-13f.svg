<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Efeito Buffett: do Form 13F à análise própria</title>
  <desc id="desc">Fluxo visual mostrando divulgação atrasada, atenção do mercado, reação de preço e reconstrução da tese.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111c"/>
      <stop offset="1" stop-color="#132a3d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee4ef"/>
      <stop offset="1" stop-color="#e4d17f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1030" cy="95" r="155" fill="#6ee4ef" opacity=".06"/>
  <circle cx="170" cy="570" r="190" fill="#e4d17f" opacity=".05"/>
  <text x="70" y="82" fill="#6ee4ef" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="3">IA EM LOOP · EDUCAÇÃO FINANCEIRA</text>
  <text x="70" y="143" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="49" font-weight="800">Copiar Buffett funciona?</text>
  <text x="70" y="188" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="25">O Form 13F é um sinal atrasado — não uma tese pronta.</text>
  <path d="M160 330 H1040" stroke="url(#line)" stroke-width="8" stroke-linecap="round" opacity=".8"/>
  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(70 245)">
      <rect width="225" height="178" rx="20" fill="#0d2030" stroke="#6ee4ef" stroke-opacity=".55"/>
      <text x="24" y="43" fill="#6ee4ef" font-size="18" font-weight="800">01 · DIVULGAÇÃO</text>
      <text x="24" y="82" fill="#fff" font-size="28" font-weight="800">Form 13F</text>
      <text x="24" y="116" fill="#cbd5e1" font-size="18">posição no fim</text>
      <text x="24" y="142" fill="#cbd5e1" font-size="18">do trimestre</text>
    </g>
    <g transform="translate(330 245)">
      <rect width="225" height="178" rx="20" fill="#0d2030" stroke="#8ed8c8" stroke-opacity=".55"/>
      <text x="24" y="43" fill="#8ed8c8" font-size="18" font-weight="800">02 · ATENÇÃO</text>
      <text x="24" y="82" fill="#fff" font-size="28" font-weight="800">Nome reconhecido</text>
      <text x="24" y="116" fill="#cbd5e1" font-size="18">mais investidores</text>
      <text x="24" y="142" fill="#cbd5e1" font-size="18">olham o ativo</text>
    </g>
    <g transform="translate(590 245)">
      <rect width="225" height="178" rx="20" fill="#0d2030" stroke="#c0d492" stroke-opacity=".6"/>
      <text x="24" y="43" fill="#c0d492" font-size="18" font-weight="800">03 · PREÇO</text>
      <text x="24" y="82" fill="#fff" font-size="28" font-weight="800">Reação</text>
      <text x="24" y="116" fill="#cbd5e1" font-size="18">informação e atenção</text>
      <text x="24" y="142" fill="#cbd5e1" font-size="18">entram no preço</text>
    </g>
    <g transform="translate(850 245)">
      <rect width="280" height="178" rx="20" fill="#17251f" stroke="#e4d17f" stroke-opacity=".8"/>
      <text x="24" y="43" fill="#e4d17f" font-size="18" font-weight="800">04 · DECISÃO</text>
      <text x="24" y="82" fill="#fff" font-size="28" font-weight="800">Reconstruir a tese</text>
      <text x="24" y="116" fill="#cbd5e1" font-size="18">qualidade · preço · risco</text>
      <text x="24" y="142" fill="#cbd5e1" font-size="18">horizonte · margem</text>
    </g>
  </g>
  <text x="70" y="500" fill="#e4d17f" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800">O estudo encontra efeito de atenção.</text>
  <text x="70" y="540" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800">A lição não é comprar atrasado. É investigar melhor.</text>
  <text x="70" y="590" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="18">Estudo preliminar · resultados históricos · custos e execução importam</text>
</svg>
