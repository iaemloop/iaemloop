<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">RANI3, embalagens, ciclo e IA operacional</title>
  <desc id="desc">Mapa visual IA em Loop conectando ranking Magic Formula, papel e embalagens, queda temporária de volume, dividendos, capital empregado e IA operacional.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06080D"/>
      <stop offset="0.55" stop-color="#102333"/>
      <stop offset="1" stop-color="#1E2A20"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#E4D17F"/>
      <stop offset="1" stop-color="#AA8451"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="80" r="220" fill="#6EE4EF" opacity="0.08"/>
  <circle cx="110" cy="560" r="260" fill="#E4D17F" opacity="0.07"/>
  <text x="70" y="85" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">IA em Loop • leitura diária • 24/05/2026</text>
  <text x="70" y="150" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800">RANI3</text>
  <text x="70" y="212" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">embalagens no teste do ciclo</text>
  <text x="70" y="260" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="25">Papel, celulose, dividendos e IA para defender margem</text>

  <g filter="url(#shadow)">
    <rect x="72" y="320" width="250" height="130" rx="22" fill="rgba(6,8,13,.72)" stroke="#E4D17F" stroke-opacity=".35"/>
    <text x="100" y="366" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Magic Formula</text>
    <text x="100" y="412" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">#27</text>
    <text x="165" y="412" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="22">Top 30</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="360" y="320" width="250" height="130" rx="22" fill="rgba(6,8,13,.72)" stroke="#6EE4EF" stroke-opacity=".28"/>
    <text x="388" y="366" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Fundamentus</text>
    <text x="388" y="412" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">P/L 9,18</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="648" y="320" width="250" height="130" rx="22" fill="rgba(6,8,13,.72)" stroke="#E4D17F" stroke-opacity=".35"/>
    <text x="676" y="366" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">1T26</text>
    <text x="676" y="412" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">lucro menor</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="936" y="320" width="190" height="130" rx="22" fill="rgba(6,8,13,.72)" stroke="#6EE4EF" stroke-opacity=".28"/>
    <text x="964" y="366" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">IA útil</text>
    <text x="964" y="412" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">margem</text>
  </g>

  <path d="M150 515 C300 475, 390 550, 525 510 S780 465, 1050 505" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" opacity=".85"/>
  <text x="70" y="575" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">Resposta: qualidade cíclica em observação — boa disciplina importa mais que pressa.</text>
