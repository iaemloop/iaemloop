<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CMIN3, mineração e margem de segurança</title>
  <desc id="desc">Diagrama IA em Loop sobre CMIN3, ranking Magic Formula, compra real, ciclo do minério, dividendos e riscos de commodity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080D"/>
      <stop offset="0.48" stop-color="#132032"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE4EF"/>
      <stop offset="1" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="92" r="210" fill="#E4D17F" opacity="0.08"/>
  <circle cx="130" cy="540" r="220" fill="#6EE4EF" opacity="0.07"/>
  <text x="70" y="88" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">IA em Loop • leitura educacional</text>
  <text x="70" y="165" fill="url(#gold)" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800">CMIN3</text>
  <text x="70" y="228" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">mineração barata ou ciclo exigindo desconto?</text>
  <text x="72" y="276" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="24">CSN Mineração na carteira real Magic Formula: retorno alto, compra recente e risco de minério.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="335" width="230" height="130" rx="18" fill="#111827" stroke="#E4D17F" stroke-opacity="0.35"/>
    <text x="95" y="378" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Magic Formula</text>
    <text x="95" y="430" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">#6</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="325" y="335" width="230" height="130" rx="18" fill="#111827" stroke="#6EE4EF" stroke-opacity="0.35"/>
    <text x="350" y="378" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">ROIC</text>
    <text x="350" y="430" fill="#6EE4EF" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">26,7%</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="580" y="335" width="230" height="130" rx="18" fill="#111827" stroke="#E4D17F" stroke-opacity="0.35"/>
    <text x="605" y="378" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Compra real</text>
    <text x="605" y="430" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">R$ 5,85</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="835" y="335" width="295" height="130" rx="18" fill="#111827" stroke="#f87171" stroke-opacity="0.35"/>
    <text x="860" y="378" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Risco central</text>
    <text x="860" y="423" fill="#fca5a5" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">minério</text>
  </g>

  <path d="M92 535 C230 490, 330 565, 470 525 S740 485, 910 530 S1080 560, 1130 505" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <text x="70" y="585" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="18">Ranking aponta preço; commodity testa paciência, caixa e disciplina de posição.</text>
</svg>
