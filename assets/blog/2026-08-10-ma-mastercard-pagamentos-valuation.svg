<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">MA, Mastercard e o teste da rede de pagamentos</title>
  <desc id="desc">Diagrama IA em Loop com ranking BESST &amp; Buffett EUA, posição em carteira real, múltiplos, geração de caixa e riscos de valuation da Mastercard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06080D"/>
      <stop offset="0.48" stop-color="#102236"/>
      <stop offset="1" stop-color="#3b2c16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#6EE4EF"/>
      <stop offset="1" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1010" cy="120" r="210" fill="#E4D17F" opacity="0.06"/>
  <circle cx="140" cy="590" r="250" fill="#6EE4EF" opacity="0.06"/>
  <rect x="60" y="55" width="1080" height="565" rx="28" fill="#131D27" opacity="0.82" stroke="#E4D17F" stroke-opacity="0.25" filter="url(#shadow)"/>
  <text x="90" y="122" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">IA em Loop • Stock EUA • Carteira real</text>
  <text x="90" y="178" fill="url(#gold)" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="900">MA / Mastercard</text>
  <text x="90" y="225" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600">Rede global de pagamentos: qualidade evidente, preço exigente</text>

  <g transform="translate(90 285)">
    <rect width="310" height="210" rx="18" fill="#06080D" opacity="0.55" stroke="#6EE4EF" stroke-opacity="0.22"/>
    <text x="24" y="44" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Ranking local</text>
    <text x="24" y="98" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900">#5</text>
    <text x="24" y="138" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">BESST &amp; Buffett EUA</text>
    <text x="24" y="174" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="20">Score 58,0 • ROE 232,1%</text>
  </g>

  <g transform="translate(445 285)">
    <rect width="310" height="210" rx="18" fill="#06080D" opacity="0.55" stroke="#E4D17F" stroke-opacity="0.22"/>
    <text x="24" y="44" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Valuation</text>
    <text x="24" y="98" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900">30,5x</text>
    <text x="24" y="138" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">P/L no rastreador</text>
    <text x="24" y="174" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="20">EV/EBITDA 22,3 • DY 0,66%</text>
  </g>

  <g transform="translate(800 285)">
    <rect width="310" height="210" rx="18" fill="#06080D" opacity="0.55" stroke="#6EE4EF" stroke-opacity="0.22"/>
    <text x="24" y="44" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">SEC 1S26</text>
    <text x="24" y="98" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900">US$ 17,7 bi</text>
    <text x="24" y="138" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">receita acumulada</text>
    <text x="24" y="174" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="20">lucro US$ 8,27 bi • caixa US$ 6,77 bi</text>
  </g>

  <path d="M110 555 C260 510, 370 590, 520 540 S820 495, 1090 535" fill="none" stroke="#6EE4EF" stroke-width="5" opacity="0.8"/>
  <circle cx="520" cy="540" r="9" fill="#E4D17F"/>
  <circle cx="830" cy="503" r="9" fill="#E4D17F"/>
  <text x="90" y="594" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="20">Pergunta do post: a vantagem competitiva da rede compensa comprar uma empresa excelente com múltiplo alto?</text>
</svg>
