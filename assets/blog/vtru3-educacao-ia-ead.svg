    <text x="24" y="84" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="900">14º</text>
    <text x="88" y="84" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="21">em maio</text>
    <text x="24" y="124" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="19">ROIC 15,0% • EY 21,0%</text>
  </g>
  <g transform="translate(440 320)">
    <rect x="0" y="0" width="320" height="170" rx="18" fill="#0b1220" opacity="0.88" stroke="#6EE4EF" stroke-opacity="0.32"/>
    <text x="24" y="42" fill="#6EE4EF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Carteira real</text>
    <text x="24" y="84" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="900">3 ações</text>
    <text x="24" y="124" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="19">custo médio R$ 14,18</text>
  </g>
