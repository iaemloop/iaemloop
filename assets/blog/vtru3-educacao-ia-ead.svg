<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">VTRU3, educação digital e IA no radar da Magic Formula</title>
  <desc id="desc">Matriz visual com ranking, carteira real, educação digital, inteligência artificial e riscos para VTRU3.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.55" stop-color="#111d2a"/>
      <stop offset="1" stop-color="#1d1408"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE4EF"/>
      <stop offset="1" stop-color="#E4D17F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="80" r="220" fill="#E4D17F" opacity="0.08"/>
  <circle cx="130" cy="560" r="220" fill="#6EE4EF" opacity="0.08"/>
  <g opacity="0.18" stroke="#E4D17F" stroke-width="1">
