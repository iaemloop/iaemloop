    <path d="M220 80v430M395 80v430M570 80v430M745 80v430M920 80v430"/>
  </g>
  <text x="80" y="92" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">IA em Loop • leitura diária • 19/05/2026</text>
  <text x="80" y="160" fill="url(#gold)" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="900">VTRU3</text>
  <text x="80" y="218" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800">educação digital precisa provar margem</text>
  <text x="80" y="262" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="25">Ranking favorece preço e retorno; carteira real exige disciplina.</text>
  <g transform="translate(80 320)">
