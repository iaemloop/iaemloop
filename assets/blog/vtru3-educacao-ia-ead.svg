    <text x="24" y="42" fill="#E4D17F" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Teste central</text>
    <text x="24" y="84" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900">escala + caixa</text>
    <text x="24" y="124" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="19">sem diluir ou perder margem</text>
  </g>
  <g transform="translate(82 535)">
