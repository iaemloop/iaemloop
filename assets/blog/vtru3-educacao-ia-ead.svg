  <path d="M870 128c60 0 109 49 109 109s-49 109-109 109-109-49-109-109 49-109 109-109Z" fill="none" stroke="#6EE4EF" stroke-width="10" opacity="0.65" filter="url(#glow)"/>
  <path d="M870 167v140M800 237h140" stroke="#E4D17F" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <text x="840" y="246" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="900">IA</text>
